<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="春节猜灯谜游戏，传统灯谜大全，增添节日趣味，感受中华传统文化的智慧魅力。">
    <meta name="keywords" content="猜灯谜,灯谜大全,春节灯谜,传统灯谜,节日游戏,元宵灯谜">
    <title>猜灯谜 - 2026宁波新春佳节</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #fef2f2 0%, #ffffff 50%, #fefce8 100%);
            min-height: 100vh;
            line-height: 1.6;
            color: #1f2937;
        }
        
        .bg-gradient-red { background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%); }
        .bg-gradient-gold { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); }
        .text-shadow { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); }
        
        /* 导航栏 */
        nav {
            background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .nav-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-back {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }
        .nav-back:hover { color: #fef08a; }
        .nav-back svg { width: 1.25rem; height: 1.25rem; }
        .nav-title { color: white; font-size: 1.125rem; font-weight: 700; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); }
        
        /* 游戏区域 */
        .riddle-section { padding: 4rem 1rem; }
        .riddle-container { max-width: 800px; margin: 0 auto; }
        
        .riddle-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .riddle-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .riddle-badge svg { width: 1rem; height: 1rem; }
        .riddle-title { font-size: 2.25rem; font-weight: 700; color: #DC2626; margin-bottom: 0.5rem; }
        .riddle-subtitle { font-size: 1.125rem; color: #6b7280; }
        
        .riddle-stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin: 2rem 0;
        }
        .riddle-stat { text-align: center; }
        .riddle-stat-value { font-size: 2rem; font-weight: 700; color: #DC2626; }
        .riddle-stat-label { font-size: 0.875rem; color: #6b7280; }
        
        /* 灯谜卡片 */
        .riddle-card {
            background: white;
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }
        .riddle-label {
            display: inline-block;
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            color: white;
            padding: 0.25rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .riddle-question { font-size: 1.5rem; font-weight: 600; color: #1f2937; margin-bottom: 1rem; }
        .riddle-hint { font-size: 0.875rem; color: #6b7280; margin-bottom: 2rem; }
        
        .answer-input-wrap {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .answer-input {
            flex: 1;
            padding: 1rem 1.5rem;
            border: 2px solid #e5e7eb;
            border-radius: 1rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .answer-input:focus { border-color: #F59E0B; }
        
        .control-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-gold { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); color: white; }
        .btn-gray { background: #6b7280; color: white; }
        .btn-red { background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%); color: white; }
        
        .feedback {
            padding: 1rem;
            border-radius: 1rem;
            margin-top: 1rem;
            display: none;
        }
        .feedback.correct { background: #ecfdf5; color: #065f46; display: block; }
        .feedback.wrong { background: #fef2f2; color: #991b1b; display: block; }
        
        /* 结果页面 */
        .result-card {
            background: linear-gradient(135deg, #fffbeb 0%, #ffedd5 100%);
            border-radius: 1.5rem;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .result-icon {
            width: 6rem;
            height: 6rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
        }
        .result-icon svg { width: 3rem; height: 3rem; color: white; }
        .result-title { font-size: 2.25rem; font-weight: 700; color: #DC2626; margin-bottom: 1rem; }
        .result-subtitle { font-size: 1.125rem; color: #374151; margin-bottom: 2rem; }
        
        .result-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .result-stat { text-align: center; }
        .result-stat-value { font-size: 2rem; font-weight: 700; color: #DC2626; }
        .result-stat-label { font-size: 0.875rem; color: #6b7280; }
        
        .result-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="nav-content">
            <a href="games.html" class="nav-back">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                <span>返回游戏</span>
            </a>
            <span class="nav-title">2026宁波新春佳节</span>
        </div>
    </nav>

    <!-- 猜灯谜游戏 -->
    <section class="riddle-section" id="riddleSection">
        <div class="riddle-container">
            <div class="riddle-header">
                <div class="riddle-badge">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>
                    猜灯谜
                </div>
                <h1 class="riddle-title">传统灯谜</h1>
                <p class="riddle-subtitle">感受中华传统文化的智慧魅力</p>
            </div>
            
            <div class="riddle-stats">
                <div class="riddle-stat">
                    <div class="riddle-stat-value" id="currentScore">0</div>
                    <div class="riddle-stat-label">当前得分</div>
                </div>
                <div class="riddle-stat">
                    <div class="riddle-stat-value" id="riddleNum">1</div>
                    <div class="riddle-stat-label">当前谜题</div>
                </div>
            </div>
            
            <div class="riddle-card">
                <span class="riddle-label" id="riddleLabel">字谜</span>
                <h2 class="riddle-question" id="riddleQuestion">一口咬掉牛尾巴</h2>
                <p class="riddle-hint" id="riddleHint">提示：打一字</p>
                
                <div class="answer-input-wrap">
                    <input type="text" class="answer-input" id="answerInput" placeholder="请输入答案">
                    <button class="control-btn btn-gold" onclick="checkAnswer()">确认</button>
                </div>
                
                <div class="feedback" id="feedback"></div>
                
                <div style="text-align: center; margin-top: 1rem;">
                    <button class="control-btn btn-gray" onclick="showAnswer()">显示答案</button>
                    <button class="control-btn btn-red" onclick="nextRiddle()">下一题</button>
                </div>
            </div>
        </div>
    </section>

    <!-- 结果页面 -->
    <section class="riddle-section" id="resultSection" style="display: none;">
        <div class="riddle-container">
            <div class="result-card">
                <div class="result-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2z"/></svg>
                </div>
                <h2 class="result-title">灯谜结束！</h2>
                <p class="result-subtitle">感谢您参与传统灯谜游戏</p>
                
                <div class="result-stats">
                    <div class="result-stat">
                        <div class="result-stat-value" id="finalScore">0</div>
                        <div class="result-stat-label">总得分</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value" id="correctCount">0</div>
                        <div class="result-stat-label">答对题数</div>
                    </div>
                </div>
                
                <div class="result-buttons">
                    <button class="control-btn btn-red" onclick="restartGame()">重新开始</button>
                    <a href="games.html" class="control-btn btn-gray">返回游戏</a>
                </div>
            </div>
        </div>
    </section>

    <script>
        const riddles = [
            { type: "字谜", question: "一口咬掉牛尾巴", hint: "提示：打一字", answer: "告" },
            { type: "地名谜", question: "双喜临门", hint: "提示：打一中国城市名", answer: "重庆" },
            { type: "字谜", question: "有头无颈，有眼无眉，无脚能走，有翅难飞", hint: "提示：打一动物", answer: "鱼" },
            { type: "物品谜", question: "身穿红衣裳，肚里火气旺，一旦脾气发，往上蹦三丈", hint: "提示：打一物", answer: "爆竹" },
            { type: "字谜", question: "一人一张口，口下长只手", hint: "提示：打一字", answer: "拿" },
            { type: "地名谜", question: "风平浪静", hint: "提示：打一中国城市名", answer: "宁波" },
            { type: "字谜", question: "四方来合作，贡献大一点", hint: "提示：打一字", answer: "器" },
            { type: "物品谜", question: "白嫩小宝宝，洗澡吹泡泡，洗洗身体小，再洗不见了", hint: "提示：打一物", answer: "肥皂" },
            { type: "字谜", question: "七十二小时", hint: "提示：打一字", answer: "晶" },
            { type: "物品谜", question: "红红火火一簇花，见风见雨就回家", hint: "提示：打一物", answer: "灯笼" }
        ];
        
        let currentRiddle = 0;
        let score = 0;
        let correctCount = 0;
        
        function loadRiddle() {
            const r = riddles[currentRiddle];
            document.getElementById('riddleLabel').textContent = r.type;
            document.getElementById('riddleQuestion').textContent = r.question;
            document.getElementById('riddleHint').textContent = r.hint;
            document.getElementById('riddleNum').textContent = currentRiddle + 1;
            document.getElementById('answerInput').value = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
        }
        
        function checkAnswer() {
            const userAnswer = document.getElementById('answerInput').value.trim();
            const feedback = document.getElementById('feedback');
            const r = riddles[currentRiddle];
            
            if (!userAnswer) {
                feedback.className = 'feedback wrong';
                feedback.textContent = '请输入答案！';
                return;
            }
            
            if (userAnswer === r.answer) {
                feedback.className = 'feedback correct';
                feedback.textContent = '恭喜你，答对了！';
                score += 10;
                correctCount++;
                document.getElementById('currentScore').textContent = score;
            } else {
                feedback.className = 'feedback wrong';
                feedback.textContent = '很遗憾，答错了！正确答案是：' + r.answer;
            }
        }
        
        function showAnswer() {
            const feedback = document.getElementById('feedback');
            const r = riddles[currentRiddle];
            feedback.className = 'feedback correct';
            feedback.textContent = '答案是：' + r.answer;
        }
        
        function nextRiddle() {
            currentRiddle++;
            if (currentRiddle < riddles.length) {
                loadRiddle();
            } else {
                showResult();
            }
        }
        
        function showResult() {
            document.getElementById('riddleSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('correctCount').textContent = correctCount;
        }
        
        function restartGame() {
            currentRiddle = 0;
            score = 0;
            correctCount = 0;
            document.getElementById('currentScore').textContent = 0;
            document.getElementById('riddleSection').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
            loadRiddle();
        }
        
        loadRiddle();
    </script>
</body>
</html>

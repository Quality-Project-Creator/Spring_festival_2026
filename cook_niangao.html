<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="宁波年糕模拟制作，在虚拟厨房中体验传统手工年糕制作过程。">
    <title>年糕模拟制作 - 2026宁波新春佳节</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            touch-action: none;
            background: #1a1a1a;
        }
        #gameCanvas { display: block; }
        .hint-box {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            z-index: 100;
            white-space: nowrap;
        }
        .step-indicator {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 100;
        }
        .step-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: all 0.3s;
        }
        .step-dot.active { background: #F59E0B; transform: scale(1.3); }
        .step-dot.done { background: #10B981; }
        #completeModal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        #completeModal.show { display: flex; }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-gradient-to-r from-red-600 to-orange-500 px-4 py-3 flex items-center justify-between">
        <a href="food_niangao.html" class="text-white flex items-center gap-2">
            <i class="fa fa-arrow-left"></i>
            <span class="text-sm">返回</span>
        </a>
        <span class="text-white font-bold">年糕制作模拟</span>
        <button onclick="showHelp()" class="text-white p-2"><i class="fa fa-question-circle"></i></button>
    </nav>

    <!-- 步骤指示器 -->
    <div class="step-indicator">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
        <div class="step-dot" id="dot3"></div>
        <div class="step-dot" id="dot4"></div>
        <div class="step-dot" id="dot5"></div>
    </div>

    <!-- 提示文字 -->
    <div class="hint-box" id="hintBox">将米和水拖入碗中浸泡</div>

    <!-- 游戏画布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 完成弹窗 -->
    <div id="completeModal">
        <div class="bg-white rounded-3xl p-8 mx-4 max-w-sm w-full text-center">
            <div class="text-6xl mb-4">🎊</div>
            <h2 class="text-2xl font-bold text-red-600 mb-2">恭喜完成！</h2>
            <p class="text-gray-600 mb-4">您已体验传统宁波年糕的水磨制作工艺</p>
            <div class="bg-yellow-50 rounded-xl p-4 mb-4">
                <p class="text-yellow-700 font-bold text-lg">年年高升</p>
            </div>
            <div class="flex gap-3">
                <button onclick="restartGame()" class="flex-1 bg-gradient-to-r from-red-500 to-orange-500 text-white py-3 rounded-full font-bold">重新制作</button>
                <a href="food_niangao.html" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-full font-bold text-center no-underline">返回步骤</a>
            </div>
        </div>
    </div>

    <!-- 帮助弹窗 -->
    <div id="helpModal" class="fixed inset-0 bg-black/70 z-[300] hidden flex items-center justify-center">
        <div class="bg-white rounded-2xl p-6 mx-4 max-w-sm">
            <h2 class="text-xl font-bold mb-4 text-center">操作说明</h2>
            <div class="space-y-3 text-sm">
                <p><span class="text-amber-500 font-bold">拖拽</span> - 移动物品到目标位置</p>
                <p><span class="text-amber-500 font-bold">旋转</span> - 手指画圈转动石磨</p>
                <p><span class="text-amber-500 font-bold">挤压</span> - 上下滑动挤压布袋</p>
                <p><span class="text-amber-500 font-bold">敲击</span> - 上下滑动搡捣年糕</p>
            </div>
            <button onclick="hideHelp()" class="mt-4 w-full bg-gray-100 py-3 rounded-xl font-medium">知道了</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hintBox = document.getElementById('hintBox');
        
        let W, H;
        let currentStep = 1;
        let gameState = {
            riceInBowl: false,
            waterInBowl: false,
            grindAngle: 0,
            grindCount: 0,
            squeezeY: 0,
            squeezeCount: 0,
            steamTime: 0,
            poundY: 0,
            poundCount: 0,
            isSteaming: false
        };
        
        // 拖拽状态
        let dragging = null;
        let dragOffsetX = 0, dragOffsetY = 0;
        let lastTouchX = 0, lastTouchY = 0;
        let isRotating = false;
        let isSqueezing = false;
        let isPounding = false;
        
        // 物品位置
        let items = {
            riceBag: { x: 0, y: 0, size: 0 },
            waterPot: { x: 0, y: 0, size: 0 },
            bowl: { x: 0, y: 0, size: 0 },
            mill: { x: 0, y: 0, size: 0 },
            bag: { x: 0, y: 0, size: 0 },
            steamer: { x: 0, y: 0, size: 0 },
            mortar: { x: 0, y: 0, size: 0 },
            pestle: { x: 0, y: 0, size: 0 }
        };
        
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            layoutItems();
        }
        
        function layoutItems() {
            const cx = W / 2;
            const cy = H / 2;
            const scale = Math.min(W, H) / 600;
            
            // 步骤1: 浸米
            items.riceBag = { x: W * 0.2, y: cy, size: 70 * scale };
            items.waterPot = { x: W * 0.8, y: cy, size: 60 * scale };
            items.bowl = { x: cx, y: cy + 30, size: 90 * scale };
            
            // 其他步骤物品
            items.mill = { x: cx, y: cy, size: 140 * scale };
            items.bag = { x: cx, y: cy, size: 100 * scale };
            items.steamer = { x: cx, y: cy, size: 130 * scale };
            items.mortar = { x: cx, y: cy + 20, size: 110 * scale };
            items.pestle = { x: cx + 100 * scale, y: cy - 50, size: 80 * scale };
        }
        
        // ========== 绘制函数 ==========
        
        function drawBowl(x, y, size) {
            // 碗身
            ctx.beginPath();
            ctx.ellipse(x, y + size * 0.35, size, size * 0.45, 0, Math.PI, 0);
            const grad = ctx.createRadialGradient(x, y, size * 0.3, x, y, size);
            grad.addColorStop(0, '#C9A66B');
            grad.addColorStop(0.7, '#8B6914');
            grad.addColorStop(1, '#5C4A1F');
            ctx.fillStyle = grad;
            ctx.fill();
            
            // 碗内
            ctx.beginPath();
            ctx.ellipse(x, y, size * 0.85, size * 0.38, 0, 0, Math.PI * 2);
            
            if (gameState.riceInBowl && gameState.waterInBowl) {
                ctx.fillStyle = '#F5F0E1'; // 米水混合
            } else if (gameState.riceInBowl) {
                ctx.fillStyle = '#FFF8E7'; // 只有米
            } else if (gameState.waterInBowl) {
                ctx.fillStyle = '#B8D4E8'; // 只有水
            } else {
                ctx.fillStyle = '#3D2E1A'; // 空碗
            }
            ctx.fill();
        }
        
        function drawRiceBag(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            // 袋子主体
            ctx.beginPath();
            ctx.roundRect(-size, -size * 1.3, size * 2, size * 2.6, size * 0.2);
            const grad = ctx.createLinearGradient(-size, 0, size, 0);
            grad.addColorStop(0, '#D4C4A8');
            grad.addColorStop(0.5, '#F0E6D2');
            grad.addColorStop(1, '#D4C4A8');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = '#8B7355';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // 米粒
            ctx.fillStyle = '#FFF8DC';
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.ellipse(
                    (Math.random() - 0.5) * size * 1.5,
                    (Math.random() - 0.5) * size * 2,
                    4, 6, Math.random() * Math.PI, 0, Math.PI * 2
                );
                ctx.fill();
            }
            
            // 标签
            ctx.fillStyle = '#8B4513';
            ctx.font = `bold ${size * 0.35}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('粳米', 0, size * 0.15);
            
            ctx.restore();
        }
        
        function drawWaterPot(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            // 壶身
            ctx.beginPath();
            ctx.ellipse(0, size * 0.2, size * 0.7, size * 0.9, 0, 0, Math.PI * 2);
            const grad = ctx.createLinearGradient(-size, 0, size, 0);
            grad.addColorStop(0, '#6BA3D6');
            grad.addColorStop(0.5, '#9FC5E8');
            grad.addColorStop(1, '#6BA3D6');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = '#4A7BA7';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // 壶嘴
            ctx.beginPath();
            ctx.moveTo(size * 0.5, -size * 0.1);
            ctx.quadraticCurveTo(size, -size * 0.4, size * 0.7, -size * 0.8);
            ctx.strokeStyle = '#4A7BA7';
            ctx.lineWidth = size * 0.15;
            ctx.lineCap = 'round';
            ctx.stroke();
            
            // 把手
            ctx.beginPath();
            ctx.arc(-size * 0.75, size * 0.1, size * 0.35, Math.PI * 0.4, Math.PI * 1.6);
            ctx.lineWidth = size * 0.12;
            ctx.stroke();
            
            // 水
            ctx.beginPath();
            ctx.ellipse(0, size * 0.3, size * 0.5, size * 0.55, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(135,206,235,0.6)';
            ctx.fill();
            
            // 标签
            ctx.fillStyle = '#2C5F7C';
            ctx.font = `bold ${size * 0.28}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('清水', 0, size * 0.4);
            
            ctx.restore();
        }
        
        function drawMill(x, y, size, rotation) {
            ctx.save();
            ctx.translate(x, y);
            
            // 底座
            ctx.beginPath();
            ctx.ellipse(0, size * 0.5, size * 0.9, size * 0.25, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#5C4033';
            ctx.fill();
            
            // 下磨盘
            ctx.beginPath();
            ctx.ellipse(0, size * 0.25, size * 0.8, size * 0.22, 0, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(0, size * 0.25, 0, 0, size * 0.25, size * 0.8);
            grad.addColorStop(0, '#9E9E9E');
            grad.addColorStop(1, '#616161');
            ctx.fillStyle = grad;
            ctx.fill();
            
            // 上磨盘（可旋转）
            ctx.save();
            ctx.rotate(rotation);
            
            ctx.beginPath();
            ctx.ellipse(0, -size * 0.1, size * 0.7, size * 0.2, 0, 0, Math.PI * 2);
            const topGrad = ctx.createRadialGradient(0, -size * 0.1, 0, 0, -size * 0.1, size * 0.7);
            topGrad.addColorStop(0, '#BDBDBD');
            topGrad.addColorStop(1, '#757575');
            ctx.fillStyle = topGrad;
            ctx.fill();
            
            // 磨纹
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(0, -size * 0.1);
                ctx.lineTo(Math.cos(angle) * size * 0.6, -size * 0.1 + Math.sin(angle) * size * 0.15);
                ctx.stroke();
            }
            
            // 把手孔
            ctx.beginPath();
            ctx.arc(size * 0.4, -size * 0.1, size * 0.08, 0, Math.PI * 2);
            ctx.fillStyle = '#4A4A4A';
            ctx.fill();
            
            ctx.restore();
            
            // 把手
            ctx.beginPath();
            ctx.moveTo(size * 0.4, -size * 0.1);
            ctx.lineTo(size * 1.1, -size * 0.5);
            ctx.strokeStyle = '#6D4C41';
            ctx.lineWidth = size * 0.1;
            ctx.lineCap = 'round';
            ctx.stroke();
            
            // 进度显示
            if (currentStep === 2) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.font = `bold ${size * 0.18}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(`研磨: ${gameState.grindCount}/15`, 0, size * 0.85);
            }
            
            ctx.restore();
        }
        
        function drawClothBag(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            const squeeze = gameState.squeezeCount / 8;
            
            // 袋子主体（根据挤压程度变化形状）
            ctx.beginPath();
            const bulge = 1 + (1 - squeeze) * 0.4;
            ctx.moveTo(-size * bulge, -size * 1.2);
            ctx.quadraticCurveTo(-size * 1.3 * bulge, 0, -size * bulge, size * 0.8);
            ctx.quadraticCurveTo(0, size * (1 - squeeze * 0.3), size * bulge, size * 0.8);
            ctx.quadraticCurveTo(size * 1.3 * bulge, 0, size * bulge, -size * 1.2);
            ctx.closePath();
            
            const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 1.5);
            grad.addColorStop(0, 'rgba(255,250,240,0.9)');
            grad.addColorStop(1, 'rgba(245,245,220,0.7)');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = '#A09060';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 米浆（如果有）
            if (gameState.squeezeCount < 8) {
                ctx.beginPath();
                ctx.ellipse(0, size * 0.2 * (1 - squeeze * 0.5), size * 0.6 * bulge, size * 0.4, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#FFF8E7';
                ctx.fill();
            }
            
            // 水滴效果
            if (isSqueezing && gameState.squeezeCount < 8) {
                ctx.fillStyle = 'rgba(100,180,255,0.7)';
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    ctx.arc(
                        (Math.random() - 0.5) * size * 0.8,
                        size + 20 + Math.random() * 30,
                        4, 0, Math.PI * 2
                    );
                    ctx.fill();
                }
            }
            
            // 进度
            if (currentStep === 3) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.font = `bold ${size * 0.15}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(`挤压: ${gameState.squeezeCount}/8`, 0, size * 1.5);
            }
            
            ctx.restore();
        }
        
        function drawSteamer(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            // 蒸笼底座
            ctx.beginPath();
            ctx.ellipse(0, size * 0.4, size * 0.9, size * 0.25, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#8B4513';
            ctx.fill();
            
            // 蒸笼身
            ctx.beginPath();
            ctx.moveTo(-size * 0.9, size * 0.4);
            ctx.lineTo(-size * 0.85, -size * 0.3);
            ctx.quadraticCurveTo(0, -size * 0.5, size * 0.85, -size * 0.3);
            ctx.lineTo(size * 0.9, size * 0.4);
            ctx.closePath();
            
            const grad = ctx.createLinearGradient(-size, 0, size, 0);
            grad.addColorStop(0, '#D2691E');
            grad.addColorStop(0.5, '#F4A460');
            grad.addColorStop(1, '#D2691E');
            ctx.fillStyle = grad;
            ctx.fill();
            
            // 竹编纹理
            ctx.strokeStyle = 'rgba(139,69,19,0.3)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 6; i++) {
                const yPos = -size * 0.2 + i * size * 0.12;
                ctx.beginPath();
                ctx.moveTo(-size * 0.8, yPos);
                ctx.lineTo(size * 0.8, yPos);
                ctx.stroke();
            }
            
            // 年糕
            const cooked = gameState.steamTime / 100;
            ctx.beginPath();
            ctx.ellipse(0, size * 0.1, size * 0.5, size * 0.15, 0, 0, Math.PI * 2);
            const r = Math.floor(255 - cooked * 30);
            const g = Math.floor(248 - cooked * 20);
            const b = Math.floor(220 - cooked * 80);
            ctx.fillStyle = `rgb(${r},${g},${b})`;
            ctx.fill();
            
            // 蒸汽效果
            if (gameState.isSteaming) {
                ctx.globalAlpha = 0.5;
                for (let i = 0; i < 5; i++) {
                    const steamY = -size * 0.6 - i * 25 - Math.sin(Date.now() / 400 + i) * 8;
                    const steamSize = 15 + i * 8;
                    ctx.beginPath();
                    ctx.arc(
                        Math.sin(Date.now() / 300 + i * 1.5) * 15,
                        steamY,
                        steamSize, 0, Math.PI * 2
                    );
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
            
            // 进度
            if (currentStep === 4) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.font = `bold ${size * 0.15}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText(`蒸制: ${Math.floor(gameState.steamTime)}%`, 0, size * 0.85);
            }
            
            ctx.restore();
        }
        
        function drawMortar(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            // 臼体
            ctx.beginPath();
            ctx.moveTo(-size * 0.9, size * 0.6);
            ctx.lineTo(-size * 0.6, -size * 0.3);
            ctx.quadraticCurveTo(0, -size * 0.45, size * 0.6, -size * 0.3);
            ctx.lineTo(size * 0.9, size * 0.6);
            ctx.closePath();
            
            const grad = ctx.createLinearGradient(-size, 0, size, 0);
            grad.addColorStop(0, '#616161');
            grad.addColorStop(0.5, '#9E9E9E');
            grad.addColorStop(1, '#616161');
            ctx.fillStyle = grad;
            ctx.fill();
            
            // 臼内
            ctx.beginPath();
            ctx.ellipse(0, -size * 0.2, size * 0.45, size * 0.18, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#4A4A4A';
            ctx.fill();
            
            // 年糕团
            ctx.beginPath();
            ctx.ellipse(0, -size * 0.15, size * 0.35, size * 0.12, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#FFF8F0';
            ctx.fill();
            
            ctx.restore();
        }
        
        function drawPestle(x, y, size, poundOffset) {
            ctx.save();
            ctx.translate(x, y + poundOffset);
            
            // 杵头
            ctx.beginPath();
            ctx.roundRect(-size * 0.2, size * 0.2, size * 0.4, size * 0.5, 6);
            ctx.fillStyle = '#6D4C41';
            ctx.fill();
            
            // 杵柄
            ctx.beginPath();
            ctx.roundRect(-size * 0.12, -size * 0.8, size * 0.24, size, 4);
            ctx.fillStyle = '#8D6E63';
            ctx.fill();
            
            ctx.restore();
        }
        
        // ========== 主绘制循环 ==========
        
        function draw() {
            ctx.clearRect(0, 0, W, H);
            
            // 背景
            const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, '#2C1810');
            bgGrad.addColorStop(0.4, '#4A3728');
            bgGrad.addColorStop(1, '#3D2E1F');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);
            
            // 台面
            ctx.fillStyle = '#5C4033';
            ctx.fillRect(0, H * 0.35, W, H * 0.65);
            
            // 木纹
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < W; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, H * 0.35);
                ctx.lineTo(i, H);
                ctx.stroke();
            }
            
            const cx = W / 2, cy = H / 2;
            
            // 根据步骤绘制
            switch (currentStep) {
                case 1:
                    drawBowl(items.bowl.x, items.bowl.y, items.bowl.size);
                    if (!gameState.riceInBowl) drawRiceBag(items.riceBag.x, items.riceBag.y, items.riceBag.size);
                    if (!gameState.waterInBowl) drawWaterPot(items.waterPot.x, items.waterPot.y, items.waterPot.size);
                    break;
                    
                case 2:
                    drawMill(items.mill.x, items.mill.y, items.mill.size, gameState.grindAngle);
                    break;
                    
                case 3:
                    drawClothBag(items.bag.x, items.bag.y, items.bag.size);
                    break;
                    
                case 4:
                    drawSteamer(items.steamer.x, items.steamer.y, items.steamer.size);
                    break;
                    
                case 5:
                    drawMortar(items.mortar.x, items.mortar.y, items.mortar.size);
                    drawPestle(items.pestle.x, items.pestle.y, items.pestle.size, gameState.poundY);
                    break;
            }
            
            // 更新蒸汽
            if (gameState.isSteaming && gameState.steamTime < 100) {
                gameState.steamTime += 0.5;
                if (gameState.steamTime >= 100) {
                    gameState.isSteaming = false;
                    setTimeout(() => nextStep(), 500);
                }
            }
            
            requestAnimationFrame(draw);
        }
        
        // ========== 交互处理 ==========
        
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
        }
        
        function dist(a, b) {
            return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
        }
        
        canvas.addEventListener('mousedown', onStart);
        canvas.addEventListener('mousemove', onMove);
        canvas.addEventListener('mouseup', onEnd);
        canvas.addEventListener('touchstart', onStart, { passive: false });
        canvas.addEventListener('touchmove', onMove, { passive: false });
        canvas.addEventListener('touchend', onEnd);
        
        function onStart(e) {
            e.preventDefault();
            const pos = getPos(e);
            lastTouchX = pos.x;
            lastTouchY = pos.y;
            
            if (currentStep === 1) {
                // 检查是否点击了米袋或水壶
                if (!gameState.riceInBowl && dist(pos, items.riceBag) < items.riceBag.size) {
                    dragging = 'rice';
                    dragOffsetX = pos.x - items.riceBag.x;
                    dragOffsetY = pos.y - items.riceBag.y;
                } else if (!gameState.waterInBowl && dist(pos, items.waterPot) < items.waterPot.size) {
                    dragging = 'water';
                    dragOffsetX = pos.x - items.waterPot.x;
                    dragOffsetY = pos.y - items.waterPot.y;
                }
            } else if (currentStep === 2) {
                // 研磨模式
                isRotating = true;
            } else if (currentStep === 3) {
                // 挤压模式
                isSqueezing = true;
            } else if (currentStep === 4) {
                // 开始蒸制
                if (!gameState.isSteaming && gameState.steamTime === 0) {
                    gameState.isSteaming = true;
                    updateHint('正在蒸制，请稍候...');
                }
            } else if (currentStep === 5) {
                // 搡捣模式
                isPounding = true;
            }
        }
        
        function onMove(e) {
            e.preventDefault();
            const pos = getPos(e);
            const dx = pos.x - lastTouchX;
            const dy = pos.y - lastTouchY;
            
            if (currentStep === 1 && dragging) {
                if (dragging === 'rice') {
                    items.riceBag.x = pos.x - dragOffsetX;
                    items.riceBag.y = pos.y - dragOffsetY;
                } else if (dragging === 'water') {
                    items.waterPot.x = pos.x - dragOffsetX;
                    items.waterPot.y = pos.y - dragOffsetY;
                }
            } else if (currentStep === 2 && isRotating) {
                // 旋转石磨 - 通过移动来旋转
                const angle = Math.atan2(pos.y - items.mill.y, pos.x - items.mill.x);
                const lastAngle = Math.atan2(lastTouchY - items.mill.y, lastTouchX - items.mill.x);
                let delta = angle - lastAngle;
                if (delta > Math.PI) delta -= Math.PI * 2;
                if (delta < -Math.PI) delta += Math.PI * 2;
                
                gameState.grindAngle += delta;
                
                // 每转一圈增加计数
                if (Math.abs(gameState.grindAngle - gameState.grindCount * Math.PI * 2) > Math.PI * 2) {
                    gameState.grindCount++;
                    if (gameState.grindCount >= 15) {
                        setTimeout(() => nextStep(), 500);
                    }
                }
            } else if (currentStep === 3 && isSqueezing) {
                // 挤压布袋 - 上下移动
                if (Math.abs(dy) > 10) {
                    gameState.squeezeCount++;
                    if (gameState.squeezeCount >= 8) {
                        setTimeout(() => nextStep(), 500);
                    }
                    lastTouchY = pos.y;
                }
            } else if (currentStep === 5 && isPounding) {
                // 搡捣 - 上下移动
                gameState.poundY = Math.min(50, Math.max(-50, gameState.poundY + dy * 0.5));
                
                if (gameState.poundY > 40) {
                    gameState.poundCount++;
                    gameState.poundY = -30;
                    if (gameState.poundCount >= 20) {
                        setTimeout(() => showComplete(), 500);
                    }
                }
            }
            
            lastTouchX = pos.x;
            lastTouchY = pos.y;
        }
        
        function onEnd(e) {
            if (currentStep === 1 && dragging) {
                const pos = getPos(e.changedTouches ? { touches: [e.changedTouches[0]] } : e);
                
                // 检查是否放入碗中
                if (dist(pos, items.bowl) < items.bowl.size * 1.5) {
                    if (dragging === 'rice') {
                        gameState.riceInBowl = true;
                        layoutItems();
                        if (!gameState.waterInBowl) {
                            updateHint('米已放入，现在加入清水');
                        }
                    } else if (dragging === 'water') {
                        gameState.waterInBowl = true;
                        layoutItems();
                        if (!gameState.riceInBowl) {
                            updateHint('水已加入，现在放入粳米');
                        }
                    }
                    
                    // 检查是否完成
                    if (gameState.riceInBowl && gameState.waterInBowl) {
                        updateHint('浸泡完成！');
                        setTimeout(() => nextStep(), 1000);
                    }
                } else {
                    // 放回原位
                    layoutItems();
                }
            }
            
            dragging = null;
            isRotating = false;
            isSqueezing = false;
            isPounding = false;
        }
        
        // ========== 步骤控制 ==========
        
        function nextStep() {
            currentStep++;
            updateStepDots();
            
            const hints = {
                2: '用手指画圈转动石磨研磨',
                3: '上下滑动挤压布袋沥水',
                4: '点击开始蒸制',
                5: '上下滑动搡捣年糕 (20次)'
            };
            
            if (hints[currentStep]) {
                updateHint(hints[currentStep]);
            }
        }
        
        function updateStepDots() {
            for (let i = 1; i <= 5; i++) {
                const dot = document.getElementById(`dot${i}`);
                dot.className = 'step-dot';
                if (i < currentStep) dot.classList.add('done');
                else if (i === currentStep) dot.classList.add('active');
            }
        }
        
        function updateHint(text) {
            hintBox.textContent = text;
        }
        
        function showComplete() {
            document.getElementById('completeModal').classList.add('show');
        }
        
        function restartGame() {
            currentStep = 1;
            gameState = {
                riceInBowl: false,
                waterInBowl: false,
                grindAngle: 0,
                grindCount: 0,
                squeezeY: 0,
                squeezeCount: 0,
                steamTime: 0,
                poundY: 0,
                poundCount: 0,
                isSteaming: false
            };
            layoutItems();
            updateStepDots();
            updateHint('将米和水拖入碗中浸泡');
            document.getElementById('completeModal').classList.remove('show');
        }
        
        function showHelp() {
            document.getElementById('helpModal').classList.remove('hidden');
        }
        
        function hideHelp() {
            document.getElementById('helpModal').classList.add('hidden');
        }
        
        // 初始化
        window.addEventListener('resize', resize);
        resize();
        draw();
    </script>
</body>
</html>

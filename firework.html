<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="春节烟花模拟器，点击屏幕绽放绚丽烟花，感受节日氛围。">
    <meta name="keywords" content="烟花模拟器,春节烟花,放烟花,节日庆祝">
    <title>烟花模拟器 - 2026宁波新春佳节</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #000;
            overflow: hidden;
            min-height: 100vh;
        }
        
        #fireworkCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to right, #b91c1c, #dc2626, #ea580c);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 50;
        }
        
        .nav-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .nav-link:hover { color: #fef08a; }
        
        .nav-title {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
        }
        
        .hint {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 9999px;
            z-index: 40;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }
        
        .hint-icon {
            color: #facc15;
            margin-right: 8px;
        }
        
        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 16px;
            z-index: 40;
        }
        
        .controls-inner {
            max-width: 672px;
            margin: 0 auto;
        }
        
        .counter {
            text-align: center;
            margin-bottom: 16px;
        }
        
        .counter-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
            border-radius: 9999px;
            padding: 8px 24px;
        }
        
        .counter-icon { color: #facc15; margin-right: 8px; }
        .counter-text { color: #fff; font-weight: 700; }
        
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            padding: 12px 24px;
            border-radius: 9999px;
            font-weight: 600;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .btn:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.3); transform: translateY(-2px); }
        
        .btn-blue { background: linear-gradient(to right, #3b82f6, #06b6d4); }
        .btn-red { background: linear-gradient(to right, #ef4444, #f97316); }
        .btn-green { background: linear-gradient(to right, #22c55e, #10b981); }
        .btn-purple { background: linear-gradient(to right, #a855f7, #ec4899); }
        .btn-gray { background: linear-gradient(to right, #4b5563, #374151); }
        
        .btn-icon { margin-right: 8px; width: 16px; height: 16px; }
        
        .color-picker {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            align-items: center;
        }
        
        .color-label {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-right: 8px;
        }
        
        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.5);
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .color-btn:hover { transform: scale(1.1); }
        .color-rainbow { background: linear-gradient(to right, #ef4444, #eab308, #3b82f6); }
        .color-red { background: #ef4444; }
        .color-gold { background: #eab308; }
        .color-green { background: #22c55e; }
        .color-blue { background: #3b82f6; }
        .color-purple { background: #a855f7; }
        
        /* SVG图标样式 */
        .icon { width: 20px; height: 20px; fill: currentColor; }
        .icon-sm { width: 16px; height: 16px; }
    </style>
</head>
<body>
    <canvas id="fireworkCanvas"></canvas>
    
    <!-- 顶部导航 -->
    <nav class="nav">
        <div class="nav-inner">
            <a href="games.html" class="nav-link">
                <svg class="icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                <span>返回游戏</span>
            </a>
            <span class="nav-title">烟花模拟器</span>
            <div style="width:80px"></div>
        </div>
    </nav>
    
    <!-- 提示 -->
    <div class="hint">
        <svg class="icon hint-icon" style="width:16px;height:16px;display:inline-block;vertical-align:middle" viewBox="0 0 24 24"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7z"/></svg>
        点击屏幕绽放烟花
    </div>
    
    <!-- 底部控制 -->
    <div class="controls">
        <div class="controls-inner">
            <div class="counter">
                <div class="counter-badge">
                    <svg class="icon counter-icon" style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    <span class="counter-text">烟花数量: <span id="fireworkCount">0</span></span>
                </div>
            </div>
            
            <div class="btn-group">
                <button onclick="toggleSound()" id="soundBtn" class="btn btn-blue">
                    <svg id="soundIcon" class="icon-sm btn-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    <span id="soundBtnText">音效已开启</span>
                </button>
                
                <button onclick="toggleAutoLaunch()" id="autoBtn" class="btn btn-red">
                    <svg class="icon-sm btn-icon" viewBox="0 0 24 24"><path d="M7 8v8l5.5-4L7 8zm5.5 4l5.5 4V8l-5.5 4z"/></svg>
                    <span id="autoBtnText">开启自动烟花</span>
                </button>
                
                <button onclick="launchMultiple(5)" class="btn btn-purple">
                    <svg class="icon-sm btn-icon" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    烟花盛宴
                </button>
                
                <button onclick="clearCanvas()" class="btn btn-gray">
                    <svg class="icon-sm btn-icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    清空画面
                </button>
            </div>
            
            <div class="color-picker">
                <span class="color-label">烟花颜色:</span>
                <button onclick="setColor('random')" class="color-btn color-rainbow" title="随机"></button>
                <button onclick="setColor('red')" class="color-btn color-red" title="红色"></button>
                <button onclick="setColor('gold')" class="color-btn color-gold" title="金色"></button>
                <button onclick="setColor('green')" class="color-btn color-green" title="绿色"></button>
                <button onclick="setColor('blue')" class="color-btn color-blue" title="蓝色"></button>
                <button onclick="setColor('purple')" class="color-btn color-purple" title="紫色"></button>
            </div>
        </div>
    </div>
    
    <script>
        // ============ 音效系统 ============
        let audioContext = null;
        let soundEnabled = true;
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }
        
        function playLaunchSound() {
            if (!soundEnabled || !audioContext) return;
            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, audioContext.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.5);
                gain.gain.setValueAtTime(0.15, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                osc.start();
                osc.stop(audioContext.currentTime + 0.5);
            } catch(e) {}
        }
        
        function playExplosionSound() {
            if (!soundEnabled || !audioContext) return;
            try {
                const bufferSize = audioContext.sampleRate * 0.3;
                const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
                }
                const noise = audioContext.createBufferSource();
                noise.buffer = buffer;
                const gain = audioContext.createGain();
                gain.gain.setValueAtTime(0.4, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                noise.connect(gain);
                gain.connect(audioContext.destination);
                noise.start();
            } catch(e) {}
        }
        
        function toggleSound() {
            initAudio();
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundBtn');
            const text = document.getElementById('soundBtnText');
            const icon = document.getElementById('soundIcon');
            
            if (soundEnabled) {
                text.textContent = '音效已开启';
                icon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
                btn.className = 'btn btn-blue';
            } else {
                text.textContent = '音效已关闭';
                icon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
                btn.className = 'btn btn-gray';
            }
        }
        
        // ============ 烟花系统 ============
        const canvas = document.getElementById('fireworkCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        let fireworkCount = 0;
        let autoLaunch = false;
        let autoLaunchInterval = null;
        let selectedColor = 'random';
        
        const colors = {
            red: ['#ff0000', '#ff4444', '#ff6666', '#ff8888'],
            gold: ['#ffd700', '#ffcc00', '#ffaa00', '#ff8800'],
            green: ['#00ff00', '#44ff44', '#66ff66', '#88ff88'],
            blue: ['#0088ff', '#00aaff', '#00ccff', '#00eeff'],
            purple: ['#8800ff', '#aa00ff', '#cc00ff', '#ee00ff']
        };
        
        function getRandomColor() {
            if (selectedColor === 'random') {
                const keys = Object.keys(colors);
                const arr = colors[keys[Math.floor(Math.random() * keys.length)]];
                return arr[Math.floor(Math.random() * arr.length)];
            }
            const arr = colors[selectedColor];
            return arr[Math.floor(Math.random() * arr.length)];
        }
        
        const fireworks = [];
        
        class Particle {
            constructor(x, y, color, vx, vy) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = vx;
                this.vy = vy;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
            }
            
            update() {
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.vy += 0.03;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color + Math.floor(this.alpha * 255).toString(16).padStart(2, '0');
                ctx.fill();
            }
        }
        
        class Firework {
            constructor(x, targetY) {
                this.x = x;
                this.y = canvas.height;
                this.targetY = targetY;
                this.color = getRandomColor();
                this.vy = -12 - Math.random() * 4;
                this.vx = (Math.random() - 0.5) * 2;
                this.exploded = false;
                this.particles = [];
                this.trail = [];
            }
            
            update() {
                if (!this.exploded) {
                    this.trail.push({x: this.x, y: this.y});
                    if (this.trail.length > 10) this.trail.shift();
                    
                    this.vy += 0.2;
                    this.x += this.vx;
                    this.y += this.vy;
                    
                    if (this.vy >= 0 || this.y <= this.targetY) {
                        this.explode();
                    }
                } else {
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        this.particles[i].update();
                        if (this.particles[i].alpha <= 0) {
                            this.particles.splice(i, 1);
                        }
                    }
                }
            }
            
            explode() {
                this.exploded = true;
                fireworkCount++;
                document.getElementById('fireworkCount').textContent = fireworkCount;
                playExplosionSound();
                
                const count = 80 + Math.floor(Math.random() * 40);
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 / count) * i;
                    const speed = Math.random() * 6 + 2;
                    this.particles.push(new Particle(
                        this.x, this.y,
                        Math.random() > 0.7 ? getRandomColor() : this.color,
                        Math.cos(angle) * speed + (Math.random() - 0.5) * 2,
                        Math.sin(angle) * speed + (Math.random() - 0.5) * 2
                    ));
                }
            }
            
            draw() {
                if (!this.exploded) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                } else {
                    this.particles.forEach(p => p.draw());
                }
            }
            
            isFinished() {
                return this.exploded && this.particles.length === 0;
            }
        }
        
        function launchFirework(x, targetY) {
            fireworks.push(new Firework(x, targetY));
            initAudio();
            playLaunchSound();
        }
        
        function launchMultiple(count) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    launchFirework(
                        Math.random() * canvas.width,
                        Math.random() * canvas.height * 0.5 + 50
                    );
                }, i * 200);
            }
        }
        
        function clearCanvas() {
            fireworks.length = 0;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        function toggleAutoLaunch() {
            autoLaunch = !autoLaunch;
            const btn = document.getElementById('autoBtn');
            const text = document.getElementById('autoBtnText');
            
            if (autoLaunch) {
                text.textContent = '关闭自动烟花';
                btn.className = 'btn btn-green';
                autoLaunchInterval = setInterval(() => {
                    launchFirework(
                        Math.random() * canvas.width,
                        Math.random() * canvas.height * 0.5 + 50
                    );
                }, 800);
            } else {
                text.textContent = '开启自动烟花';
                btn.className = 'btn btn-red';
                clearInterval(autoLaunchInterval);
            }
        }
        
        function setColor(color) {
            selectedColor = color;
        }
        
        canvas.addEventListener('click', (e) => {
            initAudio();
            launchFirework(e.clientX, e.clientY);
        });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            initAudio();
            launchFirework(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
        
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                fireworks[i].draw();
                if (fireworks[i].isFinished()) {
                    fireworks.splice(i, 1);
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        animate();
        setTimeout(() => launchMultiple(3), 500);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鳗鲞模拟制作 - 2026宁波新春佳节</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; overflow: hidden; touch-action: none; background: #1a1a1a; }
        #gameCanvas { display: block; }
        .hint-box { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 16px; z-index: 100; }
        .step-indicator { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 100; }
        .step-dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: all 0.3s; }
        .step-dot.active { background: #3B82F6; transform: scale(1.3); }
        .step-dot.done { background: #10B981; }
        #completeModal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 200; }
        #completeModal.show { display: flex; }
    </style>
</head>
<body>
    <nav class="fixed top-0 left-0 right-0 z-50 bg-gradient-to-r from-blue-600 to-indigo-600 px-4 py-3 flex items-center justify-between">
        <a href="food_manxiang.html" class="text-white flex items-center gap-2"><i class="fa fa-arrow-left"></i><span class="text-sm">返回</span></a>
        <span class="text-white font-bold">鳗鲞制作模拟</span>
        <button onclick="showHelp()" class="text-white p-2"><i class="fa fa-question-circle"></i></button>
    </nav>

    <div class="step-indicator">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
        <div class="step-dot" id="dot3"></div>
        <div class="step-dot" id="dot4"></div>
        <div class="step-dot" id="dot5"></div>
    </div>

    <div class="hint-box" id="hintBox">选择新鲜的海鳗</div>
    <canvas id="gameCanvas"></canvas>

    <div id="completeModal">
        <div class="bg-white rounded-3xl p-8 mx-4 max-w-sm w-full text-center">
            <div class="text-6xl mb-4">🐟</div>
            <h2 class="text-2xl font-bold text-blue-600 mb-2">恭喜完成！</h2>
            <p class="text-gray-600 mb-4">您已掌握新风鳗鲞的传统制作工艺</p>
            <div class="bg-blue-50 rounded-xl p-4 mb-4"><p class="text-blue-700 font-bold text-lg">年年有余</p></div>
            <div class="flex gap-3">
                <button onclick="restartGame()" class="flex-1 bg-gradient-to-r from-blue-500 to-indigo-500 text-white py-3 rounded-full font-bold">重新制作</button>
                <a href="food_manxiang.html" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-full font-bold text-center no-underline">返回步骤</a>
            </div>
        </div>
    </div>

    <div id="helpModal" class="fixed inset-0 bg-black/70 z-[300] hidden flex items-center justify-center">
        <div class="bg-white rounded-2xl p-6 mx-4 max-w-sm">
            <h2 class="text-xl font-bold mb-4 text-center">操作说明</h2>
            <div class="space-y-3 text-sm">
                <p><span class="text-blue-500 font-bold">拖拽</span> - 选择或移动物品</p>
                <p><span class="text-blue-500 font-bold">滑动</span> - 清理、抹盐</p>
                <p><span class="text-blue-500 font-bold">等待</span> - 风干需要时间</p>
            </div>
            <button onclick="hideHelp()" class="mt-4 w-full bg-gray-100 py-3 rounded-xl font-medium">知道了</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hintBox = document.getElementById('hintBox');
        
        let W, H;
        let currentStep = 1;
        let gameState = {
            selectedEel: null,
            cleaned: false,
            cleanProgress: 0,
            salted: false,
            saltProgress: 0,
            dryingTime: 0,
            isDrying: false,
            steamTime: 0,
            isSteaming: false
        };
        
        let dragging = null;
        let lastTouchX = 0, lastTouchY = 0;
        let isCleaning = false;
        let isSalting = false;
        
        let items = {};
        
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            layoutItems();
        }
        
        function layoutItems() {
            const cx = W / 2, cy = H / 2;
            const scale = Math.min(W, H) / 600;
            
            items = {
                eels: [
                    { x: W * 0.25, y: cy, size: 100 * scale, good: true },
                    { x: W * 0.5, y: cy, size: 90 * scale, good: false },
                    { x: W * 0.75, y: cy, size: 110 * scale, good: true }
                ],
                board: { x: cx, y: cy, size: 150 * scale },
                salt: { x: W * 0.2, y: cy, size: 50 * scale },
                rope: { x: cx, y: cy * 0.5, size: 80 * scale },
                steamer: { x: cx, y: cy, size: 120 * scale }
            };
        }
        
        // ========== 绘制函数 ==========
        
        function drawEel(x, y, size, good, cleaned, dried) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(0.3);
            
            // 鳗鱼身体
            ctx.beginPath();
            ctx.moveTo(-size, 0);
            ctx.quadraticCurveTo(-size * 0.5, -size * 0.3, 0, -size * 0.2);
            ctx.quadraticCurveTo(size * 0.5, -size * 0.1, size, 0);
            ctx.quadraticCurveTo(size * 0.5, size * 0.1, 0, size * 0.2);
            ctx.quadraticCurveTo(-size * 0.5, size * 0.3, -size, 0);
            ctx.closePath();
            
            let bodyColor;
            if (dried) {
                bodyColor = '#B8956B';
            } else if (cleaned) {
                bodyColor = '#E8D4B8';
            } else if (good) {
                bodyColor = '#4A7BA7';
            } else {
                bodyColor = '#6A8A9A';
            }
            ctx.fillStyle = bodyColor;
            ctx.fill();
            ctx.strokeStyle = dried ? '#8B7355' : '#2C5F7C';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // 眼睛
            if (!cleaned) {
                ctx.beginPath();
                ctx.arc(size * 0.7, -size * 0.05, size * 0.08, 0, Math.PI * 2);
                ctx.fillStyle = good ? '#000' : '#666';
                ctx.fill();
                
                // 眼睛光泽
                ctx.beginPath();
                ctx.arc(size * 0.72, -size * 0.07, size * 0.03, 0, Math.PI * 2);
                ctx.fillStyle = '#FFF';
                ctx.fill();
            }
            
            // 鳍
            if (!cleaned && !dried) {
                ctx.beginPath();
                ctx.moveTo(-size * 0.8, 0);
                ctx.lineTo(-size * 1.1, -size * 0.15);
                ctx.lineTo(-size * 1.1, size * 0.15);
                ctx.closePath();
                ctx.fillStyle = bodyColor;
                ctx.fill();
                ctx.stroke();
            }
            
            // 好鳗鱼标记
            if (!cleaned && good) {
                ctx.fillStyle = '#10B981';
                ctx.font = `bold ${size * 0.2}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.rotate(-0.3);
                ctx.fillText('新鲜', 0, size * 0.5);
            }
            
            ctx.restore();
        }
        
        function drawBoard(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            ctx.beginPath();
            ctx.roundRect(-size, -size * 0.5, size * 2, size, 10);
            ctx.fillStyle = '#D2B48C';
            ctx.fill();
            ctx.strokeStyle = '#8B7355';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            ctx.restore();
        }
        
        function drawSalt(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            ctx.beginPath();
            ctx.roundRect(-size, -size * 0.8, size * 2, size * 1.6, 8);
            ctx.fillStyle = '#F5F5F5';
            ctx.fill();
            ctx.strokeStyle = '#CCC';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 盐粒
            ctx.fillStyle = '#FFF';
            for (let i = 0; i < 20; i++) {
                ctx.beginPath();
                ctx.arc(
                    (Math.random() - 0.5) * size * 1.5,
                    (Math.random() - 0.5) * size,
                    2, 0, Math.PI * 2
                );
                ctx.fill();
            }
            
            ctx.fillStyle = '#666';
            ctx.font = `bold ${size * 0.4}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('精盐', 0, size * 0.4);
            
            ctx.restore();
        }
        
        function drawRope(x, y, size) {
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(x - size, y);
            ctx.lineTo(x + size, y);
            ctx.stroke();
            
            // 绳结
            ctx.beginPath();
            ctx.arc(x - size, y, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#8B4513';
            ctx.fill();
        }
        
        function drawSteamer(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            // 蒸笼
            ctx.beginPath();
            ctx.ellipse(0, size * 0.3, size, size * 0.35, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#8B4513';
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(-size, size * 0.3);
            ctx.lineTo(-size * 0.9, -size * 0.2);
            ctx.quadraticCurveTo(0, -size * 0.35, size * 0.9, -size * 0.2);
            ctx.lineTo(size, size * 0.3);
            ctx.closePath();
            
            const grad = ctx.createLinearGradient(-size, 0, size, 0);
            grad.addColorStop(0, '#D2691E');
            grad.addColorStop(0.5, '#F4A460');
            grad.addColorStop(1, '#D2691E');
            ctx.fillStyle = grad;
            ctx.fill();
            
            // 盖子
            ctx.beginPath();
            ctx.ellipse(0, -size * 0.25, size * 0.8, size * 0.2, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#A0522D';
            ctx.fill();
            
            // 蒸汽
            if (gameState.isSteaming) {
                ctx.globalAlpha = 0.5;
                for (let i = 0; i < 4; i++) {
                    const steamY = -size * 0.5 - i * 20 - Math.sin(Date.now() / 400 + i) * 8;
                    ctx.beginPath();
                    ctx.arc(Math.sin(Date.now() / 300 + i) * 12, steamY, 10 + i * 5, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
            
            ctx.restore();
        }
        
        // ========== 主绘制 ==========
        
        function draw() {
            ctx.clearRect(0, 0, W, H);
            
            // 背景
            const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, '#1A2A3A');
            bgGrad.addColorStop(1, '#2A3A4A');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);
            
            // 台面
            ctx.fillStyle = '#4A5A6A';
            ctx.fillRect(0, H * 0.35, W, H * 0.65);
            
            const cx = W / 2, cy = H / 2;
            
            switch (currentStep) {
                case 1: // 选购
                    items.eels.forEach((eel, i) => {
                        if (!gameState.selectedEel || gameState.selectedEel === i) {
                            drawEel(eel.x, eel.y, eel.size, eel.good, false, false);
                        }
                    });
                    ctx.fillStyle = '#FFF';
                    ctx.font = 'bold 18px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('点击选择新鲜、眼睛明亮的海鳗', cx, cy + 150);
                    break;
                    
                case 2: // 清理
                    drawBoard(items.board.x, items.board.y, items.board.size);
                    const eel = items.eels[gameState.selectedEel];
                    drawEel(cx, cy, eel.size * 0.8, true, gameState.cleaned, false);
                    
                    if (!gameState.cleaned) {
                        ctx.fillStyle = '#FFF';
                        ctx.font = 'bold 18px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(`清理: ${gameState.cleanProgress}/15`, cx, cy + items.board.size + 40);
                    }
                    break;
                    
                case 3: // 腌制
                    drawBoard(items.board.x, items.board.y, items.board.size);
                    drawEel(cx, cy, items.board.size * 0.7, true, true, false);
                    
                    if (!gameState.salted) {
                        drawSalt(items.salt.x, items.salt.y, items.salt.size);
                        ctx.fillStyle = '#FFF';
                        ctx.font = 'bold 18px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(`抹盐: ${gameState.saltProgress}/20`, cx, cy + items.board.size + 40);
                    }
                    break;
                    
                case 4: // 风干
                    drawRope(items.rope.x, items.rope.y, items.rope.size);
                    
                    // 挂着的鳗鲞
                    const dried = gameState.dryingTime / 100;
                    ctx.save();
                    ctx.translate(cx, items.rope.y + 20);
                    
                    // 挂绳
                    ctx.strokeStyle = '#8B4513';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, 30);
                    ctx.stroke();
                    
                    drawEel(0, 80, 80, true, true, dried > 0.8);
                    ctx.restore();
                    
                    ctx.fillStyle = '#FFF';
                    ctx.font = 'bold 18px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`风干: ${Math.floor(gameState.dryingTime)}%`, cx, cy + 150);
                    
                    if (gameState.isDrying && gameState.dryingTime < 100) {
                        gameState.dryingTime += 0.3;
                        if (gameState.dryingTime >= 100) {
                            gameState.isDrying = false;
                            setTimeout(() => nextStep(), 500);
                        }
                    }
                    break;
                    
                case 5: // 蒸制
                    drawSteamer(items.steamer.x, items.steamer.y, items.steamer.size);
                    
                    ctx.fillStyle = '#FFF';
                    ctx.font = 'bold 18px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`蒸制: ${Math.floor(gameState.steamTime)}%`, cx, cy + 150);
                    
                    if (gameState.isSteaming && gameState.steamTime < 100) {
                        gameState.steamTime += 0.4;
                        if (gameState.steamTime >= 100) {
                            gameState.isSteaming = false;
                            setTimeout(() => showComplete(), 500);
                        }
                    }
                    break;
            }
            
            requestAnimationFrame(draw);
        }
        
        // ========== 交互 ==========
        
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
        }
        
        function dist(a, b) {
            return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
        }
        
        canvas.addEventListener('mousedown', onStart);
        canvas.addEventListener('mousemove', onMove);
        canvas.addEventListener('mouseup', onEnd);
        canvas.addEventListener('touchstart', onStart, { passive: false });
        canvas.addEventListener('touchmove', onMove, { passive: false });
        canvas.addEventListener('touchend', onEnd);
        
        function onStart(e) {
            e.preventDefault();
            const pos = getPos(e);
            lastTouchX = pos.x;
            lastTouchY = pos.y;
            
            if (currentStep === 1 && gameState.selectedEel === null) {
                items.eels.forEach((eel, i) => {
                    if (dist(pos, eel) < eel.size) {
                        if (eel.good) {
                            gameState.selectedEel = i;
                            setTimeout(() => nextStep(), 500);
                        } else {
                            updateHint('这条不新鲜，请重新选择');
                        }
                    }
                });
            } else if (currentStep === 2 && !gameState.cleaned) {
                isCleaning = true;
            } else if (currentStep === 3 && !gameState.salted) {
                const eel = items.eels[gameState.selectedEel];
                if (dist(pos, items.salt) < items.salt.size * 1.5) {
                    dragging = 'salt';
                } else {
                    isSalting = true;
                }
            } else if (currentStep === 4 && !gameState.isDrying) {
                gameState.isDrying = true;
                updateHint('正在风干，请稍候...');
            } else if (currentStep === 5 && !gameState.isSteaming) {
                gameState.isSteaming = true;
                updateHint('正在蒸制，请稍候...');
            }
        }
        
        function onMove(e) {
            e.preventDefault();
            const pos = getPos(e);
            const dx = pos.x - lastTouchX;
            const dy = pos.y - lastTouchY;
            
            if (currentStep === 2 && isCleaning) {
                if (Math.abs(dx) + Math.abs(dy) > 8) {
                    gameState.cleanProgress++;
                    if (gameState.cleanProgress >= 15) {
                        gameState.cleaned = true;
                        setTimeout(() => nextStep(), 500);
                    }
                    lastTouchX = pos.x;
                    lastTouchY = pos.y;
                }
            } else if (currentStep === 3 && isSalting) {
                if (Math.abs(dx) + Math.abs(dy) > 6) {
                    gameState.saltProgress++;
                    if (gameState.saltProgress >= 20) {
                        gameState.salted = true;
                        setTimeout(() => nextStep(), 500);
                    }
                    lastTouchX = pos.x;
                    lastTouchY = pos.y;
                }
            }
        }
        
        function onEnd(e) {
            isCleaning = false;
            isSalting = false;
            dragging = null;
        }
        
        function nextStep() {
            currentStep++;
            updateStepDots();
            
            const hints = {
                2: '滑动清理海鳗内脏',
                3: '将盐拖到鳗鱼上滑动抹匀',
                4: '点击开始风干',
                5: '点击开始蒸制'
            };
            
            if (hints[currentStep]) updateHint(hints[currentStep]);
        }
        
        function updateStepDots() {
            for (let i = 1; i <= 5; i++) {
                const dot = document.getElementById(`dot${i}`);
                dot.className = 'step-dot';
                if (i < currentStep) dot.classList.add('done');
                else if (i === currentStep) dot.classList.add('active');
            }
        }
        
        function updateHint(text) { hintBox.textContent = text; }
        function showComplete() { document.getElementById('completeModal').classList.add('show'); }
        
        function restartGame() {
            currentStep = 1;
            gameState = {
                selectedEel: null, cleaned: false, cleanProgress: 0,
                salted: false, saltProgress: 0, dryingTime: 0, isDrying: false,
                steamTime: 0, isSteaming: false
            };
            layoutItems();
            updateStepDots();
            updateHint('选择新鲜的海鳗');
            document.getElementById('completeModal').classList.remove('show');
        }
        
        function showHelp() { document.getElementById('helpModal').classList.remove('hidden'); }
        function hideHelp() { document.getElementById('helpModal').classList.add('hidden'); }
        
        window.addEventListener('resize', resize);
        resize();
        draw();
    </script>
</body>
</html>

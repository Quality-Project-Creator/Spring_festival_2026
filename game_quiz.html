<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="春节年俗知识问答游戏，测试您对春节传统文化和宁波年俗的了解程度，寓教于乐。">
    <meta name="keywords" content="春节问答,年俗知识,春节知识问答,宁波年俗,传统文化问答">
    <title>年俗问答 - 2026宁波新春佳节</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #fef2f2 0%, #ffffff 50%, #fefce8 100%);
            min-height: 100vh;
            line-height: 1.6;
            color: #1f2937;
        }
        
        .bg-gradient-red { background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%); }
        .bg-gradient-gold { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); }
        .bg-gradient-green { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .text-shadow { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); }
        
        /* 导航栏 */
        nav {
            background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .nav-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-back {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }
        .nav-back:hover { color: #fef08a; }
        .nav-back svg { width: 1.25rem; height: 1.25rem; }
        .nav-title { color: white; font-size: 1.125rem; font-weight: 700; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); }
        
        /* 游戏区域 */
        .quiz-section { padding: 4rem 1rem; }
        .quiz-container { max-width: 800px; margin: 0 auto; }
        
        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .quiz-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .quiz-badge svg { width: 1rem; height: 1rem; }
        .quiz-title { font-size: 2.25rem; font-weight: 700; color: #DC2626; margin-bottom: 0.5rem; }
        .quiz-subtitle { font-size: 1.125rem; color: #6b7280; }
        
        .quiz-stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin: 2rem 0;
        }
        .quiz-stat { text-align: center; }
        .quiz-stat-value { font-size: 2rem; font-weight: 700; color: #DC2626; }
        .quiz-stat-label { font-size: 0.875rem; color: #6b7280; }
        
        .progress-bar-wrap {
            background: #e5e7eb;
            border-radius: 9999px;
            height: 0.5rem;
            overflow: hidden;
            margin-bottom: 2rem;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            border-radius: 9999px;
            transition: width 0.5s;
        }
        
        /* 问题卡片 */
        .question-card {
            background: white;
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }
        .question-number {
            font-size: 0.875rem;
            color: #F59E0B;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .question-text { font-size: 1.5rem; font-weight: 600; color: #1f2937; margin-bottom: 2rem; }
        
        .options-list { display: flex; flex-direction: column; gap: 1rem; }
        .option-btn {
            width: 100%;
            padding: 1rem 1.5rem;
            border: 2px solid #e5e7eb;
            border-radius: 1rem;
            background: white;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .option-btn:hover { border-color: #F59E0B; background: #fffbeb; }
        .option-btn.correct { border-color: #10b981; background: #ecfdf5; }
        .option-btn.wrong { border-color: #ef4444; background: #fef2f2; }
        .option-btn:disabled { cursor: not-allowed; }
        
        /* 结果页面 */
        .result-card {
            background: linear-gradient(135deg, #fffbeb 0%, #ffedd5 100%);
            border-radius: 1.5rem;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .result-icon {
            width: 6rem;
            height: 6rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
        }
        .result-icon svg { width: 3rem; height: 3rem; color: white; }
        .result-title { font-size: 2.25rem; font-weight: 700; color: #DC2626; margin-bottom: 1rem; }
        .result-subtitle { font-size: 1.125rem; color: #374151; margin-bottom: 2rem; }
        
        .result-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .result-stat { text-align: center; }
        .result-stat-value { font-size: 2rem; font-weight: 700; color: #DC2626; }
        .result-stat-label { font-size: 0.875rem; color: #6b7280; }
        
        .result-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }
        .control-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: box-shadow 0.3s;
        }
        .control-btn:hover { box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); }
        .btn-red { background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%); color: white; }
        .btn-gold { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); color: white; }
        .btn-gray { background: #6b7280; color: white; }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="nav-content">
            <a href="games.html" class="nav-back">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                <span>返回游戏</span>
            </a>
            <span class="nav-title">2026宁波新春佳节</span>
        </div>
    </nav>

    <!-- 问答游戏 -->
    <section class="quiz-section" id="quizSection">
        <div class="quiz-container">
            <div class="quiz-header">
                <div class="quiz-badge">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/></svg>
                    年俗问答
                </div>
                <h1 class="quiz-title">春节知识问答</h1>
                <p class="quiz-subtitle">测试您对春节传统文化和宁波年俗的了解程度</p>
            </div>
            
            <div class="quiz-stats">
                <div class="quiz-stat">
                    <div class="quiz-stat-value" id="currentScore">0</div>
                    <div class="quiz-stat-label">当前得分</div>
                </div>
                <div class="quiz-stat">
                    <div class="quiz-stat-value" id="questionNum">1</div>
                    <div class="quiz-stat-label">当前题目</div>
                </div>
            </div>
            
            <div class="progress-bar-wrap">
                <div class="progress-bar" id="progressBar" style="width: 10%"></div>
            </div>
            
            <div class="question-card" id="questionCard">
                <div class="question-number">问题 <span id="qNumber">1</span>/10</div>
                <h2 class="question-text" id="questionText">春节是农历的哪一天？</h2>
                <div class="options-list" id="optionsList"></div>
            </div>
        </div>
    </section>

    <!-- 结果页面 -->
    <section class="quiz-section" id="resultSection" style="display: none;">
        <div class="quiz-container">
            <div class="result-card">
                <div class="result-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2z"/></svg>
                </div>
                <h2 class="result-title">问答结束！</h2>
                <p class="result-subtitle">感谢您参与春节知识问答</p>
                
                <div class="result-stats">
                    <div class="result-stat">
                        <div class="result-stat-value" id="finalScore">0</div>
                        <div class="result-stat-label">总得分</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value" id="correctCount">0</div>
                        <div class="result-stat-label">正确题数</div>
                    </div>
                </div>
                
                <div class="result-buttons">
                    <button class="control-btn btn-red" onclick="restartQuiz()">重新开始</button>
                    <a href="games.html" class="control-btn btn-gray">返回游戏</a>
                </div>
            </div>
        </div>
    </section>

    <script>
        const questions = [
            { question: "春节是农历的哪一天？", options: ["正月初一", "腊月三十", "正月十五", "腊月廿三"], answer: 0 },
            { question: "宁波汤圆最经典的馅料是什么？", options: ["豆沙馅", "芝麻猪油馅", "花生馅", "鲜肉馅"], answer: 1 },
            { question: "天一阁是中国最古老的什么建筑？", options: ["寺庙", "私家藏书楼", "官府", "书院"], answer: 1 },
            { question: "宁波人过年必备的年糕寓意什么？", options: ["团团圆圆", "年年高升", "吉祥如意", "财源广进"], answer: 1 },
            { question: "奉化布龙是哪一级非物质文化遗产？", options: ["市级", "省级", "国家级", "世界级"], answer: 2 },
            { question: "宁波的别称是什么？", options: ["甬城", "越城", "姚城", "杭城"], answer: 0 },
            { question: "河姆渡文化距今约有多少年历史？", options: ["3000年", "5000年", "7000年", "9000年"], answer: 2 },
            { question: "红膏呛蟹是宁波的什么菜肴？", options: ["热菜", "汤菜", "冷菜", "烧烤"], answer: 2 },
            { question: "元宵节是农历的哪一天？", options: ["正月初一", "正月十五", "腊月三十", "二月初二"], answer: 1 },
            { question: "宁波位于哪个省份？", options: ["江苏", "上海", "浙江", "福建"], answer: 2 }
        ];
        
        let currentQuestion = 0;
        let score = 0;
        let correctCount = 0;
        
        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('qNumber').textContent = currentQuestion + 1;
            document.getElementById('questionNum').textContent = currentQuestion + 1;
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('progressBar').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            
            const optionsList = document.getElementById('optionsList');
            optionsList.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
                btn.onclick = () => selectAnswer(index);
                optionsList.appendChild(btn);
            });
        }
        
        function selectAnswer(index) {
            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach(btn => btn.disabled = true);
            
            if (index === q.answer) {
                buttons[index].classList.add('correct');
                score += 10;
                correctCount++;
            } else {
                buttons[index].classList.add('wrong');
                buttons[q.answer].classList.add('correct');
            }
            
            document.getElementById('currentScore').textContent = score;
            
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            }, 1000);
        }
        
        function showResult() {
            document.getElementById('quizSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('correctCount').textContent = correctCount;
        }
        
        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            correctCount = 0;
            document.getElementById('currentScore').textContent = 0;
            document.getElementById('quizSection').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
            loadQuestion();
        }
        
        loadQuestion();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026宁波新春佳节 - 感受七千年河姆渡文化传承</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#DC2626',
                        secondary: '#F59E0B',
                        accent: '#059669',
                        gold: '#D97706',
                        'chinese-red': '#DC2626',
                        'chinese-gold': '#D97706'
                    },
                    fontFamily: {
                        chinese: ['PingFang SC', 'Microsoft YaHei', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'bounce-slow': 'bounce 2s infinite',
                        'pulse-slow': 'pulse 3s infinite',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-shadow {
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            }
            .text-shadow-lg {
                text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
            }
            .bg-gradient-red {
                background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
            }
            .bg-gradient-gold {
                background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            }
            .bg-gradient-green {
                background: linear-gradient(135deg, #059669 0%, #047857 100%);
            }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .nav-card {
            transition: all 0.3s ease;
        }
        
        .nav-card:hover {
            transform: translateY(-10px) scale(1.02);
        }
        
        .nav-card:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body class="font-chinese bg-gradient-to-br from-red-50 via-white to-yellow-50 min-h-screen">
    <!-- 顶部标题栏 -->
    <header class="bg-gradient-red shadow-2xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-center space-x-3">
                <div class="bg-white/20 p-2 rounded-full">
                    <i class="fa fa-fire text-2xl text-yellow-200"></i>
                </div>
                <span class="text-white text-xl md:text-2xl font-bold text-shadow">2026宁波新春佳节</span>
            </div>
        </div>
    </header>

    <!-- 主页横幅 -->
    <section class="relative py-12 md:py-20 overflow-hidden">
        <!-- 背景装饰 -->
        <div class="absolute inset-0">
            <div class="absolute top-10 left-10 w-20 h-20 bg-gradient-gold rounded-full opacity-20 animate-pulse-slow"></div>
            <div class="absolute top-32 right-20 w-16 h-16 bg-gradient-red rounded-full opacity-20 animate-pulse-slow" style="animation-delay: 1s;"></div>
            <div class="absolute bottom-32 left-20 w-24 h-24 bg-gradient-gold rounded-full opacity-20 animate-pulse-slow" style="animation-delay: 2s;"></div>
            <div class="absolute bottom-10 right-10 w-12 h-12 bg-gradient-red rounded-full opacity-20 animate-pulse-slow" style="animation-delay: 0.5s;"></div>
        </div>
        
        <div class="relative z-10 text-center px-4">
            <!-- 春节装饰 -->
            <div class="mb-6">
                <div class="inline-block bg-gradient-gold text-white px-6 py-3 rounded-full text-lg font-semibold shadow-lg">
                    <i class="fa fa-star mr-2"></i>2026龙年大吉
                </div>
            </div>
            
            <!-- 主标题 -->
            <h1 class="text-4xl md:text-6xl font-bold text-chinese-red mb-4 text-shadow-lg">
                2026宁波新春佳节
            </h1>
            
            <!-- 副标题 -->
            <p class="text-lg md:text-xl text-gray-700 mb-6 max-w-3xl mx-auto leading-relaxed">
                感受七千年河姆渡文化传承，体验甬城独特的春节民俗风情
            </p>
            
            <!-- 祝福语句 -->
            <div class="bg-white/80 backdrop-blur-sm rounded-2xl p-4 shadow-xl mb-8 max-w-2xl mx-auto">
                <p class="text-lg text-gray-800 leading-relaxed font-medium">
                    恭祝大家龙年大吉，万事如意，身体健康，阖家幸福！
                </p>
            </div>
        </div>
    </section>

    <!-- 导航卡片区域 -->
    <section class="py-8 md:py-16 px-4">
        <div class="max-w-6xl mx-auto">
            <h2 class="text-2xl md:text-3xl font-bold text-center text-chinese-red mb-8 md:mb-12">
                <i class="fa fa-compass mr-2"></i>探索宁波春节
            </h2>
            
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">
                <!-- 春节知识 -->
                <a href="knowledge.html" class="nav-card block">
                    <div class="bg-gradient-to-br from-red-500 to-red-600 rounded-2xl md:rounded-3xl p-4 md:p-6 shadow-xl text-center h-full">
                        <div class="bg-white/20 w-12 h-12 md:w-16 md:h-16 rounded-full flex items-center justify-center mx-auto mb-3 md:mb-4">
                            <i class="fa fa-book text-2xl md:text-3xl text-white"></i>
                        </div>
                        <h3 class="text-lg md:text-xl font-bold text-white mb-1 md:mb-2">春节知识</h3>
                        <p class="text-white/80 text-sm md:text-base">了解春节由来与习俗</p>
                    </div>
                </a>
                
                <!-- 宁波年俗 -->
                <a href="culture.html" class="nav-card block">
                    <div class="bg-gradient-to-br from-orange-500 to-orange-600 rounded-2xl md:rounded-3xl p-4 md:p-6 shadow-xl text-center h-full">
                        <div class="bg-white/20 w-12 h-12 md:w-16 md:h-16 rounded-full flex items-center justify-center mx-auto mb-3 md:mb-4">
                            <i class="fa fa-home text-2xl md:text-3xl text-white"></i>
                        </div>
                        <h3 class="text-lg md:text-xl font-bold text-white mb-1 md:mb-2">宁波年俗</h3>
                        <p class="text-white/80 text-sm md:text-base">体验甬城传统风俗</p>
                    </div>
                </a>
                
                <!-- 春节游戏 -->
                <a href="games.html" class="nav-card block">
                    <div class="bg-gradient-to-br from-green-500 to-green-600 rounded-2xl md:rounded-3xl p-4 md:p-6 shadow-xl text-center h-full">
                        <div class="bg-white/20 w-12 h-12 md:w-16 md:h-16 rounded-full flex items-center justify-center mx-auto mb-3 md:mb-4">
                            <i class="fa fa-gamepad text-2xl md:text-3xl text-white"></i>
                        </div>
                        <h3 class="text-lg md:text-xl font-bold text-white mb-1 md:mb-2">春节游戏</h3>
                        <p class="text-white/80 text-sm md:text-base">趣味互动小游戏</p>
                    </div>
                </a>
                
                <!-- 宁波花市 -->
                <a href="flower_market.html" class="nav-card block">
                    <div class="bg-gradient-to-br from-pink-500 to-pink-600 rounded-2xl md:rounded-3xl p-4 md:p-6 shadow-xl text-center h-full">
                        <div class="bg-white/20 w-12 h-12 md:w-16 md:h-16 rounded-full flex items-center justify-center mx-auto mb-3 md:mb-4">
                            <i class="fa fa-leaf text-2xl md:text-3xl text-white"></i>
                        </div>
                        <h3 class="text-lg md:text-xl font-bold text-white mb-1 md:mb-2">宁波花市</h3>
                        <p class="text-white/80 text-sm md:text-base">逛花市迎新春</p>
                    </div>
                </a>
                
                <!-- 特色美食 -->
                <a href="food_culture.html" class="nav-card block">
                    <div class="bg-gradient-to-br from-yellow-500 to-yellow-600 rounded-2xl md:rounded-3xl p-4 md:p-6 shadow-xl text-center h-full">
                        <div class="bg-white/20 w-12 h-12 md:w-16 md:h-16 rounded-full flex items-center justify-center mx-auto mb-3 md:mb-4">
                            <i class="fa fa-cutlery text-2xl md:text-3xl text-white"></i>
                        </div>
                        <h3 class="text-lg md:text-xl font-bold text-white mb-1 md:mb-2">特色美食</h3>
                        <p class="text-white/80 text-sm md:text-base">品味宁波传统美食</p>
                    </div>
                </a>
                
                <!-- 民俗表演 -->
                <a href="lion_dragon.html" class="nav-card block">
                    <div class="bg-gradient-to-br from-purple-500 to-purple-600 rounded-2xl md:rounded-3xl p-4 md:p-6 shadow-xl text-center h-full">
                        <div class="bg-white/20 w-12 h-12 md:w-16 md:h-16 rounded-full flex items-center justify-center mx-auto mb-3 md:mb-4">
                            <i class="fa fa-music text-2xl md:text-3xl text-white"></i>
                        </div>
                        <h3 class="text-lg md:text-xl font-bold text-white mb-1 md:mb-2">民俗表演</h3>
                        <p class="text-white/80 text-sm md:text-base">舞龙舞狮看大戏</p>
                    </div>
                </a>
            </div>
        </div>
    </section>

    <!-- 底部装饰 -->
    <section class="py-8 md:py-12">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <div class="flex justify-center space-x-4 mb-6">
                <div class="bg-white rounded-full p-3 shadow-lg animate-float">
                    <i class="fa fa-heart text-2xl text-red-400"></i>
                </div>
                <div class="bg-white rounded-full p-3 shadow-lg animate-float" style="animation-delay: 0.5s;">
                    <i class="fa fa-star text-2xl text-yellow-400"></i>
                </div>
                <div class="bg-white rounded-full p-3 shadow-lg animate-float" style="animation-delay: 1s;">
                    <i class="fa fa-fire text-2xl text-red-400"></i>
                </div>
            </div>
            <p class="text-gray-600 text-sm md:text-base">
                &copy; 2026 宁波新春佳节主题网站 | 感受七千年河姆渡文化传承
            </p>
        </div>
    </section>
</body>

</html>

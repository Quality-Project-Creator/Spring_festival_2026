<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>汤圆模拟制作 - 2026宁波新春佳节</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; overflow: hidden; touch-action: none; background: #1a1a1a; }
        #gameCanvas { display: block; }
        .hint-box { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 16px; z-index: 100; }
        .step-indicator { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 100; }
        .step-dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: all 0.3s; }
        .step-dot.active { background: #EC4899; transform: scale(1.3); }
        .step-dot.done { background: #10B981; }
        #completeModal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 200; }
        #completeModal.show { display: flex; }
    </style>
</head>
<body>
    <nav class="fixed top-0 left-0 right-0 z-50 bg-gradient-to-r from-pink-500 to-rose-500 px-4 py-3 flex items-center justify-between">
        <a href="food_tangyuan.html" class="text-white flex items-center gap-2"><i class="fa fa-arrow-left"></i><span class="text-sm">返回</span></a>
        <span class="text-white font-bold">汤圆制作模拟</span>
        <button onclick="showHelp()" class="text-white p-2"><i class="fa fa-question-circle"></i></button>
    </nav>

    <div class="step-indicator">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
        <div class="step-dot" id="dot3"></div>
        <div class="step-dot" id="dot4"></div>
        <div class="step-dot" id="dot5"></div>
    </div>

    <div class="hint-box" id="hintBox">将芝麻拖入锅中翻炒</div>
    <canvas id="gameCanvas"></canvas>

    <div id="completeModal">
        <div class="bg-white rounded-3xl p-8 mx-4 max-w-sm w-full text-center">
            <div class="text-6xl mb-4">🎉</div>
            <h2 class="text-2xl font-bold text-pink-600 mb-2">恭喜完成！</h2>
            <p class="text-gray-600 mb-4">您已学会宁波传统猪油汤圆的制作</p>
            <div class="bg-pink-50 rounded-xl p-4 mb-4"><p class="text-pink-700 font-bold text-lg">团团圆圆</p></div>
            <div class="flex gap-3">
                <button onclick="restartGame()" class="flex-1 bg-gradient-to-r from-pink-500 to-rose-500 text-white py-3 rounded-full font-bold">重新制作</button>
                <a href="food_tangyuan.html" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-full font-bold text-center no-underline">返回步骤</a>
            </div>
        </div>
    </div>

    <div id="helpModal" class="fixed inset-0 bg-black/70 z-[300] hidden flex items-center justify-center">
        <div class="bg-white rounded-2xl p-6 mx-4 max-w-sm">
            <h2 class="text-xl font-bold mb-4 text-center">操作说明</h2>
            <div class="space-y-3 text-sm">
                <p><span class="text-pink-500 font-bold">拖拽</span> - 移动食材到目标位置</p>
                <p><span class="text-pink-500 font-bold">滑动</span> - 翻炒、揉面、捏合</p>
                <p><span class="text-pink-500 font-bold">点击</span> - 开始煮制</p>
            </div>
            <button onclick="hideHelp()" class="mt-4 w-full bg-gray-100 py-3 rounded-xl font-medium">知道了</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hintBox = document.getElementById('hintBox');
        
        let W, H;
        let currentStep = 1;
        let gameState = {
            sesameInPan: false,
            roastCount: 0,
            fillingReady: false,
            doughReady: false,
            boilTime: 0,
            isBoiling: false,
            tangyuanCount: 0
        };
        
        let dragging = null;
        let dragOffsetX = 0, dragOffsetY = 0;
        let lastTouchX = 0, lastTouchY = 0;
        let isRoasting = false;
        let isKneading = false;
        let isWrapping = false;
        
        let items = {};
        
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            layoutItems();
        }
        
        function layoutItems() {
            const cx = W / 2, cy = H / 2;
            const scale = Math.min(W, H) / 600;
            
            items = {
                sesame: { x: W * 0.2, y: cy, size: 60 * scale },
                pan: { x: cx, y: cy, size: 120 * scale },
                bowl: { x: cx, y: cy, size: 100 * scale },
                sugar: { x: W * 0.2, y: cy - 80 * scale, size: 40 * scale },
                lard: { x: W * 0.8, y: cy - 80 * scale, size: 45 * scale },
                flour: { x: W * 0.15, y: cy, size: 70 * scale },
                water: { x: W * 0.85, y: cy, size: 50 * scale },
                doughBoard: { x: cx, y: cy, size: 140 * scale },
                filling: { x: W * 0.25, y: cy, size: 30 * scale },
                doughSkin: { x: cx, y: cy, size: 50 * scale },
                pot: { x: cx, y: cy, size: 130 * scale }
            };
        }
        
        // ========== 绘制函数 ==========
        
        function drawPan(x, y, size) {
            // 锅身
            ctx.beginPath();
            ctx.ellipse(x, y, size, size * 0.6, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#2D2D2D';
            ctx.fill();
            ctx.strokeStyle = '#1A1A1A';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            // 锅内
            ctx.beginPath();
            ctx.ellipse(x, y - size * 0.1, size * 0.85, size * 0.45, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#3D3D3D';
            ctx.fill();
            
            // 把手
            ctx.fillStyle = '#4A4A4A';
            ctx.fillRect(x + size, y - size * 0.2, size * 0.5, size * 0.4);
        }
        
        function drawSesame(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            // 碗
            ctx.beginPath();
            ctx.ellipse(0, size * 0.3, size, size * 0.4, 0, Math.PI, 0);
            ctx.fillStyle = '#8B4513';
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(0, 0, size * 0.85, size * 0.35, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#1A1A1A';
            ctx.fill();
            
            // 标签
            ctx.fillStyle = '#FFF';
            ctx.font = `bold ${size * 0.35}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('黑芝麻', 0, size * 0.6);
            
            ctx.restore();
        }
        
        function drawSesameInPan(x, y, size, roastLevel) {
            // 锅中芝麻
            ctx.save();
            ctx.translate(x, y - size * 0.1);
            
            const color = Math.min(255, 30 + roastLevel * 15);
            ctx.fillStyle = `rgb(${color}, ${color - 10}, ${color - 20})`;
            
            for (let i = 0; i < 50; i++) {
                const px = (Math.random() - 0.5) * size * 1.4;
                const py = (Math.random() - 0.5) * size * 0.6;
                ctx.beginPath();
                ctx.ellipse(px, py, 3, 2, Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        function drawBowl(x, y, size, content) {
            ctx.save();
            ctx.translate(x, y);
            
            // 碗身
            ctx.beginPath();
            ctx.ellipse(0, size * 0.35, size, size * 0.45, 0, Math.PI, 0);
            const grad = ctx.createRadialGradient(0, 0, size * 0.3, 0, 0, size);
            grad.addColorStop(0, '#F5F5DC');
            grad.addColorStop(1, '#D2B48C');
            ctx.fillStyle = grad;
            ctx.fill();
            
            // 碗内
            ctx.beginPath();
            ctx.ellipse(0, 0, size * 0.85, size * 0.38, 0, 0, Math.PI * 2);
            
            if (content === 'filling') {
                ctx.fillStyle = '#2D2D2D';
            } else if (content === 'dough') {
                ctx.fillStyle = '#FFF8DC';
            } else {
                ctx.fillStyle = '#F5F5DC';
            }
            ctx.fill();
            
            ctx.restore();
        }
        
        function drawSugar(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            ctx.beginPath();
            ctx.roundRect(-size, -size * 0.8, size * 2, size * 1.6, 8);
            ctx.fillStyle = '#FFF5EE';
            ctx.fill();
            ctx.strokeStyle = '#DEB887';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            for (let i = 0; i < 15; i++) {
                ctx.arc((Math.random() - 0.5) * size * 1.5, (Math.random() - 0.5) * size, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.fillStyle = '#8B4513';
            ctx.font = `bold ${size * 0.4}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('白糖', 0, size * 0.4);
            
            ctx.restore();
        }
        
        function drawLard(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            ctx.beginPath();
            ctx.ellipse(0, 0, size, size * 0.7, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#FFF8F0';
            ctx.fill();
            ctx.strokeStyle = '#E8D8C8';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#8B4513';
            ctx.font = `bold ${size * 0.35}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('猪油', 0, size * 0.3);
            
            ctx.restore();
        }
        
        function drawFlour(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            ctx.beginPath();
            ctx.roundRect(-size, -size * 1.2, size * 2, size * 2.4, 10);
            ctx.fillStyle = '#FFF8DC';
            ctx.fill();
            ctx.strokeStyle = '#DEB887';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.ellipse(0, -size * 0.3, size * 0.7, size * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#8B4513';
            ctx.font = `bold ${size * 0.35}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('糯米粉', 0, size * 0.5);
            
            ctx.restore();
        }
        
        function drawWaterCup(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            ctx.beginPath();
            ctx.roundRect(-size * 0.7, -size, size * 1.4, size * 2, 8);
            ctx.fillStyle = '#87CEEB';
            ctx.fill();
            ctx.strokeStyle = '#4A90A4';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = 'rgba(135,206,235,0.6)';
            ctx.fillRect(-size * 0.5, -size * 0.6, size, size * 1.4);
            
            ctx.fillStyle = '#2C5F7C';
            ctx.font = `bold ${size * 0.4}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('温水', 0, size * 0.4);
            
            ctx.restore();
        }
        
        function drawDoughBoard(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            ctx.beginPath();
            ctx.roundRect(-size, -size * 0.5, size * 2, size, 15);
            ctx.fillStyle = '#D2B48C';
            ctx.fill();
            ctx.strokeStyle = '#8B7355';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            ctx.restore();
        }
        
        function drawDough(x, y, size, kneadLevel) {
            ctx.save();
            ctx.translate(x, y);
            
            const smoothness = kneadLevel / 10;
            ctx.beginPath();
            
            // 根据揉捏程度改变形状
            const points = 8;
            for (let i = 0; i <= points; i++) {
                const angle = (i / points) * Math.PI * 2;
                const r = size * (0.9 + (1 - smoothness) * Math.sin(angle * 3) * 0.2);
                const px = Math.cos(angle) * r;
                const py = Math.sin(angle) * r * 0.6;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            
            ctx.fillStyle = '#FFF8DC';
            ctx.fill();
            ctx.strokeStyle = '#E8D8B8';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.restore();
        }
        
        function drawFilling(x, y, size) {
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fillStyle = '#2D2D2D';
            ctx.fill();
        }
        
        function drawDoughSkin(x, y, size) {
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,248,220,0.8)';
            ctx.fill();
            ctx.strokeStyle = '#E8D8B8';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        
        function drawTangyuan(x, y, size, progress) {
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            
            const alpha = 0.3 + progress * 0.7;
            ctx.fillStyle = `rgba(255,248,220,${alpha})`;
            ctx.fill();
            ctx.strokeStyle = '#E8D8B8';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 煮熟后略微透明
            if (progress > 0.8) {
                ctx.beginPath();
                ctx.arc(x, y - size * 0.3, size * 0.15, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(45,45,45,0.3)';
                ctx.fill();
            }
        }
        
        function drawPot(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            // 锅身
            ctx.beginPath();
            ctx.ellipse(0, size * 0.2, size, size * 0.7, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#4A4A4A';
            ctx.fill();
            
            // 水
            ctx.beginPath();
            ctx.ellipse(0, size * 0.1, size * 0.9, size * 0.55, 0, 0, Math.PI * 2);
            ctx.fillStyle = gameState.isBoiling ? 'rgba(200,230,255,0.7)' : 'rgba(135,206,235,0.5)';
            ctx.fill();
            
            // 沸腾效果
            if (gameState.isBoiling) {
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                for (let i = 0; i < 8; i++) {
                    const bx = (Math.random() - 0.5) * size * 1.4;
                    const by = -size * 0.3 + Math.random() * size * 0.5;
                    ctx.beginPath();
                    ctx.arc(bx, by, 3 + Math.random() * 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // 蒸汽
            if (gameState.isBoiling) {
                ctx.globalAlpha = 0.4;
                for (let i = 0; i < 4; i++) {
                    const steamY = -size * 0.6 - i * 25 - Math.sin(Date.now() / 400 + i) * 8;
                    ctx.beginPath();
                    ctx.arc(Math.sin(Date.now() / 300 + i) * 15, steamY, 12 + i * 6, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
            
            ctx.restore();
        }
        
        // ========== 主绘制 ==========
        
        function draw() {
            ctx.clearRect(0, 0, W, H);
            
            // 背景
            const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, '#2A1F1F');
            bgGrad.addColorStop(1, '#3D2D2D');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);
            
            // 台面
            ctx.fillStyle = '#5C4033';
            ctx.fillRect(0, H * 0.35, W, H * 0.65);
            
            const cx = W / 2, cy = H / 2;
            
            switch (currentStep) {
                case 1: // 炒芝麻
                    drawPan(items.pan.x, items.pan.y, items.pan.size);
                    if (gameState.sesameInPan) {
                        drawSesameInPan(items.pan.x, items.pan.y, items.pan.size, gameState.roastCount);
                        ctx.fillStyle = '#FFF';
                        ctx.font = 'bold 20px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(`翻炒: ${gameState.roastCount}/20`, cx, cy + items.pan.size + 40);
                    } else {
                        drawSesame(items.sesame.x, items.sesame.y, items.sesame.size);
                    }
                    break;
                    
                case 2: // 调馅
                    drawBowl(items.bowl.x, items.bowl.y, items.bowl.size, 'filling');
                    if (!gameState.fillingReady) {
                        drawSugar(items.sugar.x, items.sugar.y, items.sugar.size);
                        drawLard(items.lard.x, items.lard.y, items.lard.size);
                        ctx.fillStyle = '#FFF';
                        ctx.font = 'bold 18px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('将白糖和猪油拖入碗中混合', cx, cy + items.bowl.size + 50);
                    } else {
                        ctx.fillStyle = '#FFF';
                        ctx.font = 'bold 18px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('馅料已调制完成！', cx, cy + items.bowl.size + 50);
                    }
                    break;
                    
                case 3: // 和面
                    drawDoughBoard(items.doughBoard.x, items.doughBoard.y, items.doughBoard.size);
                    if (gameState.doughReady) {
                        drawDough(cx, cy, items.doughBoard.size * 0.5, 10);
                    } else {
                        drawFlour(items.flour.x, items.flour.y, items.flour.size);
                        drawWaterCup(items.water.x, items.water.y, items.water.size);
                        drawDough(cx, cy, items.doughBoard.size * 0.5, gameState.kneadLevel || 0);
                        ctx.fillStyle = '#FFF';
                        ctx.font = 'bold 18px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(`揉捏: ${gameState.kneadLevel || 0}/15`, cx, cy + items.doughBoard.size + 30);
                    }
                    break;
                    
                case 4: // 包汤圆
                    drawDoughBoard(items.doughBoard.x, items.doughBoard.y, items.doughBoard.size);
                    drawDoughSkin(cx, cy, items.doughSkin.size);
                    drawFilling(items.filling.x, items.filling.y, items.filling.size);
                    ctx.fillStyle = '#FFF';
                    ctx.font = 'bold 18px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`将馅料拖到面皮中央并滑动捏合 (${gameState.tangyuanCount}/6)`, cx, cy + items.doughBoard.size + 30);
                    break;
                    
                case 5: // 煮汤圆
                    drawPot(items.pot.x, items.pot.y, items.pot.size);
                    // 绘制汤圆
                    for (let i = 0; i < gameState.tangyuanCount; i++) {
                        const tx = items.pot.x + (i % 3 - 1) * 40;
                        const ty = items.pot.y - 20 + Math.floor(i / 3) * 35;
                        drawTangyuan(tx, ty, 25, gameState.boilTime / 100);
                    }
                    ctx.fillStyle = '#FFF';
                    ctx.font = 'bold 18px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`煮制: ${Math.floor(gameState.boilTime)}%`, cx, cy + items.pot.size + 50);
                    break;
            }
            
            // 自动煮制
            if (gameState.isBoiling && gameState.boilTime < 100) {
                gameState.boilTime += 0.4;
                if (gameState.boilTime >= 100) {
                    gameState.isBoiling = false;
                    setTimeout(() => showComplete(), 500);
                }
            }
            
            requestAnimationFrame(draw);
        }
        
        // ========== 交互 ==========
        
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches ? e.touches[0] : e;
            return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
        }
        
        function dist(a, b) {
            return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
        }
        
        canvas.addEventListener('mousedown', onStart);
        canvas.addEventListener('mousemove', onMove);
        canvas.addEventListener('mouseup', onEnd);
        canvas.addEventListener('touchstart', onStart, { passive: false });
        canvas.addEventListener('touchmove', onMove, { passive: false });
        canvas.addEventListener('touchend', onEnd);
        
        let mixCount = 0;
        
        function onStart(e) {
            e.preventDefault();
            const pos = getPos(e);
            lastTouchX = pos.x;
            lastTouchY = pos.y;
            
            if (currentStep === 1 && !gameState.sesameInPan) {
                if (dist(pos, items.sesame) < items.sesame.size) {
                    dragging = 'sesame';
                    dragOffsetX = pos.x - items.sesame.x;
                    dragOffsetY = pos.y - items.sesame.y;
                }
            } else if (currentStep === 1 && gameState.sesameInPan) {
                isRoasting = true;
            } else if (currentStep === 2 && !gameState.fillingReady) {
                if (dist(pos, items.sugar) < items.sugar.size * 1.5) {
                    dragging = 'sugar';
                    dragOffsetX = pos.x - items.sugar.x;
                    dragOffsetY = pos.y - items.sugar.y;
                } else if (dist(pos, items.lard) < items.lard.size * 1.5) {
                    dragging = 'lard';
                    dragOffsetX = pos.x - items.lard.x;
                    dragOffsetY = pos.y - items.lard.y;
                }
            } else if (currentStep === 3) {
                if (!gameState.doughReady && dist(pos, items.flour) < items.flour.size) {
                    dragging = 'flour';
                    dragOffsetX = pos.x - items.flour.x;
                    dragOffsetY = pos.y - items.flour.y;
                } else if (!gameState.doughReady && dist(pos, items.water) < items.water.size) {
                    dragging = 'water';
                    dragOffsetX = pos.x - items.water.x;
                    dragOffsetY = pos.y - items.water.y;
                } else {
                    isKneading = true;
                }
            } else if (currentStep === 4) {
                if (dist(pos, items.filling) < items.filling.size * 2) {
                    dragging = 'filling';
                    dragOffsetX = pos.x - items.filling.x;
                    dragOffsetY = pos.y - items.filling.y;
                }
            } else if (currentStep === 5 && !gameState.isBoiling) {
                gameState.isBoiling = true;
                updateHint('正在煮制，请稍候...');
            }
        }
        
        function onMove(e) {
            e.preventDefault();
            const pos = getPos(e);
            const dx = pos.x - lastTouchX;
            const dy = pos.y - lastTouchY;
            
            if (currentStep === 1 && dragging === 'sesame') {
                items.sesame.x = pos.x - dragOffsetX;
                items.sesame.y = pos.y - dragOffsetY;
            } else if (currentStep === 1 && isRoasting) {
                if (Math.abs(dx) + Math.abs(dy) > 5) {
                    gameState.roastCount++;
                    if (gameState.roastCount >= 20) {
                        setTimeout(() => nextStep(), 500);
                    }
                }
            } else if (currentStep === 2 && (dragging === 'sugar' || dragging === 'lard')) {
                if (dragging === 'sugar') {
                    items.sugar.x = pos.x - dragOffsetX;
                    items.sugar.y = pos.y - dragOffsetY;
                } else {
                    items.lard.x = pos.x - dragOffsetX;
                    items.lard.y = pos.y - dragOffsetY;
                }
            } else if (currentStep === 3 && (dragging === 'flour' || dragging === 'water')) {
                if (dragging === 'flour') {
                    items.flour.x = pos.x - dragOffsetX;
                    items.flour.y = pos.y - dragOffsetY;
                } else {
                    items.water.x = pos.x - dragOffsetX;
                    items.water.y = pos.y - dragOffsetY;
                }
            } else if (currentStep === 3 && isKneading) {
                if (Math.abs(dx) + Math.abs(dy) > 8) {
                    gameState.kneadLevel = (gameState.kneadLevel || 0) + 1;
                    if (gameState.kneadLevel >= 15) {
                        gameState.doughReady = true;
                        setTimeout(() => nextStep(), 500);
                    }
                    lastTouchX = pos.x;
                    lastTouchY = pos.y;
                }
            } else if (currentStep === 4 && dragging === 'filling') {
                items.filling.x = pos.x - dragOffsetX;
                items.filling.y = pos.y - dragOffsetY;
            } else if (currentStep === 4 && isWrapping) {
                // 捏合
                if (Math.abs(dy) > 10) {
                    gameState.tangyuanCount++;
                    if (gameState.tangyuanCount >= 6) {
                        setTimeout(() => nextStep(), 500);
                    }
                    lastTouchY = pos.y;
                }
            }
            
            lastTouchX = pos.x;
            lastTouchY = pos.y;
        }
        
        function onEnd(e) {
            const pos = getPos(e.changedTouches ? { touches: [e.changedTouches[0]] } : e);
            
            if (currentStep === 1 && dragging === 'sesame') {
                if (dist(pos, items.pan) < items.pan.size * 1.5) {
                    gameState.sesameInPan = true;
                    updateHint('滑动翻炒芝麻');
                }
                layoutItems();
            } else if (currentStep === 2 && (dragging === 'sugar' || dragging === 'lard')) {
                if (dist(pos, items.bowl) < items.bowl.size * 1.5) {
                    mixCount++;
                    if (mixCount >= 2) {
                        gameState.fillingReady = true;
                        setTimeout(() => nextStep(), 500);
                    }
                }
                layoutItems();
            } else if (currentStep === 3 && (dragging === 'flour' || dragging === 'water')) {
                if (dist(pos, items.doughBoard) < items.doughBoard.size) {
                    updateHint('滑动揉捏面团');
                }
                layoutItems();
            } else if (currentStep === 4 && dragging === 'filling') {
                if (dist(pos, items.doughSkin) < items.doughSkin.size * 2) {
                    isWrapping = true;
                    updateHint('滑动捏合汤圆');
                } else {
                    items.filling = { x: W * 0.25, y: H / 2, size: items.filling.size };
                }
            }
            
            dragging = null;
            isRoasting = false;
            isKneading = false;
            isWrapping = false;
        }
        
        function nextStep() {
            currentStep++;
            updateStepDots();
            
            const hints = {
                2: '将白糖和猪油拖入碗中混合',
                3: '将糯米粉和水拖到案板上',
                4: '将馅料拖到面皮中央',
                5: '点击开始煮汤圆'
            };
            
            if (hints[currentStep]) updateHint(hints[currentStep]);
        }
        
        function updateStepDots() {
            for (let i = 1; i <= 5; i++) {
                const dot = document.getElementById(`dot${i}`);
                dot.className = 'step-dot';
                if (i < currentStep) dot.classList.add('done');
                else if (i === currentStep) dot.classList.add('active');
            }
        }
        
        function updateHint(text) { hintBox.textContent = text; }
        function showComplete() { document.getElementById('completeModal').classList.add('show'); }
        
        function restartGame() {
            currentStep = 1;
            gameState = {
                sesameInPan: false, roastCount: 0, fillingReady: false,
                doughReady: false, boilTime: 0, isBoiling: false, tangyuanCount: 0
            };
            mixCount = 0;
            layoutItems();
            updateStepDots();
            updateHint('将芝麻拖入锅中翻炒');
            document.getElementById('completeModal').classList.remove('show');
        }
        
        function showHelp() { document.getElementById('helpModal').classList.remove('hidden'); }
        function hideHelp() { document.getElementById('helpModal').classList.add('hidden'); }
        
        window.addEventListener('resize', resize);
        resize();
        draw();
    </script>
</body>
</html>

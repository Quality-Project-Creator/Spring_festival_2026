<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="宁波春节美食模拟制作，跟随步骤学习制作宁波特色美食。">
    <meta name="keywords" content="美食制作,宁波汤圆,年糕,呛蟹,鳗鲞,丫头羹,烹饪教程">
    <title>美食模拟制作 - 2026宁波新春佳节</title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#DC2626',
                        secondary: '#F59E0B',
                        accent: '#059669',
                        gold: '#D97706',
                        'chinese-red': '#DC2626',
                        'chinese-gold': '#D97706'
                    },
                    fontFamily: {
                        chinese: ['PingFang SC', 'Microsoft YaHei', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(245, 158, 11, 0.5); }
            50% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.8); }
        }
        @keyframes cooking-bubble {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-30px) scale(0.5); opacity: 0; }
        }
        .float-animation { animation: float 3s ease-in-out infinite; }
        .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
        .cooking-bubble { animation: cooking-bubble 1s ease-out forwards; }
        
        .step-card {
            transition: all 0.3s ease;
        }
        .step-card.active {
            border-color: #F59E0B;
            background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
        }
        .step-card.completed {
            border-color: #059669;
            background: linear-gradient(135deg, #D1FAE5 0%, #A7F3D0 100%);
        }
        
        .progress-bar {
            transition: width 0.5s ease;
        }
        
        .food-select-card {
            transition: all 0.3s ease;
        }
        .food-select-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .food-select-card.selected {
            border-color: #DC2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.3);
        }
        
        .ingredient-item {
            transition: all 0.3s ease;
        }
        .ingredient-item.collected {
            background: linear-gradient(135deg, #D1FAE5 0%, #A7F3D0 100%);
        }
    </style>
</head>
<body class="font-chinese bg-gradient-to-br from-red-50 via-white to-yellow-50 min-h-screen">
    <!-- 导航栏 -->
    <nav class="bg-gradient-to-r from-red-600 to-orange-500 shadow-2xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <a href="javascript:history.back()" class="flex items-center space-x-2 text-white hover:text-yellow-200 transition-colors">
                    <i class="fa fa-arrow-left text-xl"></i>
                    <span class="font-medium">返回</span>
                </a>
                <span class="text-white text-lg font-bold">美食模拟制作</span>
                <div class="w-20"></div>
            </div>
        </div>
    </nav>

    <!-- 食物选择区域 -->
    <section id="foodSelect" class="py-12 px-4">
        <div class="max-w-6xl mx-auto">
            <div class="text-center mb-10">
                <h1 class="text-3xl md:text-4xl font-bold text-chinese-red mb-4">选择要制作的美食</h1>
                <p class="text-gray-600 text-lg">点击选择一道宁波特色美食，开始模拟制作</p>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 md:gap-6">
                <!-- 汤圆 -->
                <div class="food-select-card bg-white rounded-2xl p-4 md:p-6 shadow-lg cursor-pointer border-2 border-transparent" onclick="selectFood('tangyuan')">
                    <div class="bg-gradient-to-br from-red-100 to-pink-100 rounded-xl p-4 mb-4 text-center">
                        <span class="text-4xl md:text-5xl">🥟</span>
                    </div>
                    <h3 class="text-lg md:text-xl font-bold text-chinese-red text-center mb-2">宁波汤圆</h3>
                    <div class="flex justify-center items-center gap-1">
                        <span class="text-xs text-gray-500">难度</span>
                        <span class="text-yellow-500 text-sm">★★★☆☆</span>
                    </div>
                </div>
                
                <!-- 年糕 -->
                <div class="food-select-card bg-white rounded-2xl p-4 md:p-6 shadow-lg cursor-pointer border-2 border-transparent" onclick="selectFood('niangao')">
                    <div class="bg-gradient-to-br from-yellow-100 to-orange-100 rounded-xl p-4 mb-4 text-center">
                        <span class="text-4xl md:text-5xl">🍡</span>
                    </div>
                    <h3 class="text-lg md:text-xl font-bold text-chinese-red text-center mb-2">宁波年糕</h3>
                    <div class="flex justify-center items-center gap-1">
                        <span class="text-xs text-gray-500">难度</span>
                        <span class="text-yellow-500 text-sm">★★★★☆</span>
                    </div>
                </div>
                
                <!-- 呛蟹 -->
                <div class="food-select-card bg-white rounded-2xl p-4 md:p-6 shadow-lg cursor-pointer border-2 border-transparent" onclick="selectFood('qiangxie')">
                    <div class="bg-gradient-to-br from-red-100 to-orange-100 rounded-xl p-4 mb-4 text-center">
                        <span class="text-4xl md:text-5xl">🦀</span>
                    </div>
                    <h3 class="text-lg md:text-xl font-bold text-chinese-red text-center mb-2">红膏呛蟹</h3>
                    <div class="flex justify-center items-center gap-1">
                        <span class="text-xs text-gray-500">难度</span>
                        <span class="text-yellow-500 text-sm">★★★☆☆</span>
                    </div>
                </div>
                
                <!-- 鳗鲞 -->
                <div class="food-select-card bg-white rounded-2xl p-4 md:p-6 shadow-lg cursor-pointer border-2 border-transparent" onclick="selectFood('manxiang')">
                    <div class="bg-gradient-to-br from-blue-100 to-cyan-100 rounded-xl p-4 mb-4 text-center">
                        <span class="text-4xl md:text-5xl">🐟</span>
                    </div>
                    <h3 class="text-lg md:text-xl font-bold text-chinese-red text-center mb-2">新风鳗鲞</h3>
                    <div class="flex justify-center items-center gap-1">
                        <span class="text-xs text-gray-500">难度</span>
                        <span class="text-yellow-500 text-sm">★★☆☆☆</span>
                    </div>
                </div>
                
                <!-- 丫头羹 -->
                <div class="food-select-card bg-white rounded-2xl p-4 md:p-6 shadow-lg cursor-pointer border-2 border-transparent" onclick="selectFood('yatougeng')">
                    <div class="bg-gradient-to-br from-purple-100 to-pink-100 rounded-xl p-4 mb-4 text-center">
                        <span class="text-4xl md:text-5xl">🥣</span>
                    </div>
                    <h3 class="text-lg md:text-xl font-bold text-chinese-red text-center mb-2">丫头羹</h3>
                    <div class="flex justify-center items-center gap-1">
                        <span class="text-xs text-gray-500">难度</span>
                        <span class="text-yellow-500 text-sm">★★☆☆☆</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 制作区域 -->
    <section id="cookingArea" class="py-8 px-4 hidden">
        <div class="max-w-4xl mx-auto">
            <!-- 进度条 -->
            <div class="bg-white rounded-2xl p-4 shadow-lg mb-6">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-gray-700 font-medium" id="cookingTitle">制作中...</span>
                    <span class="text-chinese-red font-bold" id="progressText">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div id="progressBar" class="progress-bar bg-gradient-to-r from-red-500 to-orange-500 h-3 rounded-full" style="width: 0%"></div>
                </div>
            </div>
            
            <!-- 食材准备区 -->
            <div id="ingredientArea" class="bg-white rounded-2xl p-6 shadow-lg mb-6">
                <h2 class="text-xl font-bold text-chinese-red mb-4 flex items-center">
                    <i class="fa fa-shopping-basket mr-2"></i>准备食材
                </h2>
                <div id="ingredientList" class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <!-- 食材列表动态生成 -->
                </div>
                <button id="collectAllBtn" onclick="collectAllIngredients()" class="mt-4 w-full bg-gradient-to-r from-green-500 to-emerald-500 text-white py-3 rounded-xl font-semibold hover:shadow-lg transition-all hidden">
                    <i class="fa fa-check-circle mr-2"></i>食材已备齐，开始制作
                </button>
            </div>
            
            <!-- 步骤区 -->
            <div id="stepsArea" class="hidden">
                <div class="bg-white rounded-2xl p-6 shadow-lg">
                    <h2 class="text-xl font-bold text-chinese-red mb-4 flex items-center">
                        <i class="fa fa-list-ol mr-2"></i>制作步骤
                    </h2>
                    <div id="stepsList" class="space-y-4">
                        <!-- 步骤动态生成 -->
                    </div>
                </div>
                
                <!-- 操作按钮 -->
                <div class="flex gap-4 mt-6">
                    <button onclick="prevStep()" id="prevBtn" class="flex-1 bg-gray-200 text-gray-700 py-4 rounded-xl font-semibold hover:bg-gray-300 transition-all disabled:opacity-50" disabled>
                        <i class="fa fa-arrow-left mr-2"></i>上一步
                    </button>
                    <button onclick="nextStep()" id="nextBtn" class="flex-1 bg-gradient-to-r from-red-500 to-orange-500 text-white py-4 rounded-xl font-semibold hover:shadow-lg transition-all">
                        下一步<i class="fa fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>
            
            <!-- 完成区域 -->
            <div id="completeArea" class="hidden text-center py-12">
                <div class="bg-gradient-to-br from-yellow-100 to-orange-100 rounded-3xl p-8 shadow-xl">
                    <div class="text-6xl mb-4 float-animation">🎉</div>
                    <h2 class="text-3xl font-bold text-chinese-red mb-4">恭喜完成制作！</h2>
                    <p class="text-gray-700 text-lg mb-6" id="completeMessage">您已成功学会了这道宁波特色美食的制作方法</p>
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <button onclick="resetCooking()" class="bg-gradient-to-r from-red-500 to-orange-500 text-white px-8 py-3 rounded-full font-semibold hover:shadow-lg transition-all">
                            <i class="fa fa-redo mr-2"></i>重新制作
                        </button>
                        <button onclick="backToSelect()" class="bg-white text-chinese-red border-2 border-chinese-red px-8 py-3 rounded-full font-semibold hover:bg-red-50 transition-all">
                            <i class="fa fa-utensils mr-2"></i>选择其他美食
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // 美食数据
        const foodData = {
            tangyuan: {
                name: '宁波汤圆',
                icon: '🥟',
                description: '宁波猪油汤圆是宁波最具代表性的传统美食，以其香甜软糯的口感闻名于世。',
                ingredients: [
                    { name: '糯米粉', emoji: '🍚' },
                    { name: '黑芝麻', emoji: '🟤' },
                    { name: '猪板油', emoji: '🧈' },
                    { name: '白糖', emoji: '🧂' },
                    { name: '糖桂花', emoji: '🌼' }
                ],
                steps: [
                    {
                        title: '制作糯米粉团',
                        description: '将糯米浸泡10小时后磨成米浆，用纱布滤干水分，得到湿润的糯米粉团。',
                        tip: '水磨工艺是宁波汤圆软糯的关键',
                        action: 'mix'
                    },
                    {
                        title: '制作芝麻猪油馅',
                        description: '将黑芝麻炒香磨粉，猪板油去筋切丁，与白糖混合揉匀，搓成小圆球备用。',
                        tip: '传统馅料需手工捏制，不能搅拌',
                        action: 'shape'
                    },
                    {
                        title: '包制汤圆',
                        description: '取一小块糯米粉团，在手心摊平，放入芝麻馅，用虎口收拢搓圆。',
                        tip: '皮薄馅多是宁波汤圆的特色',
                        action: 'wrap'
                    },
                    {
                        title: '煮制汤圆',
                        description: '水沸后下汤圆，用铲背轻轻推动防粘锅。待汤圆浮起后加两次凉水，煮至再次浮起即可。',
                        tip: '点两次冷水能让汤圆内外都熟透',
                        action: 'cook'
                    },
                    {
                        title: '装盘享用',
                        description: '将煮好的汤圆盛入碗中，撒上糖桂花，趁热享用。',
                        tip: '汤圆寓意团团圆圆，是春节必备美食',
                        action: 'serve'
                    }
                ]
            },
            niangao: {
                name: '宁波年糕',
                icon: '🍡',
                description: '宁波水磨年糕以细腻柔滑的口感著称，采用传统水磨工艺制作。',
                ingredients: [
                    { name: '晚粳米', emoji: '🌾' },
                    { name: '清水', emoji: '💧' }
                ],
                steps: [
                    {
                        title: '浸泡粳米',
                        description: '将优质晚粳米用清水浸泡24小时以上，让米粒充分吸水。',
                        tip: '只选用圆粒晚粳米，不用长粒米',
                        action: 'soak'
                    },
                    {
                        title: '水磨成浆',
                        description: '将浸泡好的米加水磨成细腻的米浆，装入布袋压干水分。',
                        tip: '水磨工艺让年糕口感细腻不粘牙',
                        action: 'grind'
                    },
                    {
                        title: '蒸熟米粉',
                        description: '将压干的米粉搓碎，铺在蒸笼中蒸熟约20分钟。',
                        tip: '蒸制是年糕成形的关键步骤',
                        action: 'steam'
                    },
                    {
                        title: '搡捣成型',
                        description: '趁热将蒸好的米粉团反复搡捣，使其更有韧性，然后整理成条状。',
                        tip: '反复搡捣是年糕Q弹的秘诀',
                        action: 'pound'
                    },
                    {
                        title: '冷却保存',
                        description: '将成型的年糕放入清水中保存，每2-3天换水一次，可存放一周。',
                        tip: '年糕寓意年年高升，是春节吉祥食品',
                        action: 'store'
                    }
                ]
            },
            qiangxie: {
                name: '红膏呛蟹',
                icon: '🦀',
                description: '红膏呛蟹是宁波海鲜之王，以其鲜美独特的口感成为春节餐桌必备。',
                ingredients: [
                    { name: '鲜活梭子蟹', emoji: '🦀' },
                    { name: '海盐', emoji: '🧂' },
                    { name: '清水', emoji: '💧' },
                    { name: '姜片', emoji: '🫚' },
                    { name: '白酒', emoji: '🍶' }
                ],
                steps: [
                    {
                        title: '挑选螃蟹',
                        description: '挑选鲜活肥美的母梭子蟹，要有饱满的红膏，这样腌制出来才够味。',
                        tip: '选蟹时掂量要沉甸甸的，蟹脚要硬邦邦',
                        action: 'select'
                    },
                    {
                        title: '调制盐水',
                        description: '按1斤清水加5两盐的比例配制腌水，加入姜片和白酒。',
                        tip: '盐水比例是呛蟹成功的关键',
                        action: 'mix'
                    },
                    {
                        title: '腌制螃蟹',
                        description: '将洗净的梭子蟹整只放入盐水中，水要没过螃蟹，用盘子压住，腌制15小时。',
                        tip: '腌制时间不宜超过10天，否则会太咸',
                        action: 'pickle'
                    },
                    {
                        title: '切块装盘',

                        action: 'serve'
                    },
                    {
                        title: '配蘸料',
                        description: '将生姜末放入米醋中调成姜醋汁，用呛蟹蘸食更佳。',
                        tip: '红膏呛蟹寓意红红火火，是年夜饭必备',
                        action: 'dip'
                    }
                ]
            },
            manxiang: {
                name: '新风鳗鲞',
                icon: '🐟',
                description: '新风鳗鲞是宁波传统风味名菜，有"新风鳗鲞味胜鸡"之说。',
                ingredients: [
                    { name: '新鲜海鳗', emoji: '🐟' },
                    { name: '海盐', emoji: '🧂' },
                    { name: '料酒', emoji: '🍶' },
                    { name: '姜片', emoji: '🫚' }
                ],
                steps: [
                    {
                        title: '处理鳗鱼',
                        description: '从腹部剖开鳗鱼，去除内脏、鱼鳃和黑膜，用清水反复冲洗脊椎两侧的血线。',
                        tip: '血线要清洗干净，否则会有腥味',
                        action: 'clean'
                    },
                    {
                        title: '腌制入味',
                        description: '用厨房纸吸干鱼肉表面水分，均匀撒盐，腹部放姜片，淋料酒，腌制24小时。',
                        tip: '中途要翻面一次，确保入味均匀',
                        action: 'marinate'
                    },
                    {
                        title: '晾晒风干',
                        description: '用棉线穿过鱼鳃处，悬挂在通风向阳处晾晒2-3天，至鱼肉收缩、表面干燥。',
                        tip: '不能暴晒，否则鱼肉会变干柴',
                        action: 'dry'
                    },
                    {
                        title: '蒸制食用',
                        description: '将鳗鲞切成段，淋少许生抽，上锅蒸10-15分钟，出锅撒葱花即可。',
                        tip: '咸鲜回甘，是宁波冬日最爱的下酒菜',
                        action: 'steam'
                    }
                ]
            },
            yatougeng: {
                name: '丫头羹',
                icon: '🥣',
                description: '丫头羹是宁波镇海传统甜羹，正月十四夜必吃，寓意团圆美满。',
                ingredients: [
                    { name: '糯米圆子', emoji: '⚪' },
                    { name: '年糕丁', emoji: '🍡' },
                    { name: '红枣', emoji: '🔴' },
                    { name: '花生仁', emoji: '🥜' },
                    { name: '莲子', emoji: '🟤' },
                    { name: '桂圆', emoji: '🟡' },
                    { name: '冰糖', emoji: '🧊' },
                    { name: '干桂花', emoji: '🌼' }
                ],
                steps: [
                    {
                        title: '准备食材',

                        tip: '食材可自由搭配，千家百味',
                        action: 'prepare'
                    },
                    {
                        title: '煮制干货',
                        description: '水开后放入花生仁、赤豆、莲子滚煮，直到软糯。',
                        tip: '干货要提前浸泡，煮制更容易',
                        action: 'boil'
                    },
                    {
                        title: '加入配料',
                        description: '依次放入红枣、桂圆、年糕丁和糯米圆子，继续煮制。',
                        tip: '圆子浮起就表示熟了',
                        action: 'add'
                    },
                    {
                        title: '调味收汁',
                        description: '加入适量冰糖调味，撒入干桂花增香，如不够粘稠可少量勾芡。',
                        tip: '甜度可根据个人喜好调整',
                        action: 'season'
                    },
                    {
                        title: '盛碗享用',
                        description: '将煮好的丫头羹盛入碗中，趁热享用，寓意甜蜜团圆。',
                        tip: '正月十四夜，家家丫头羹',
                        action: 'serve'
                    }
                ]
            }
        };

        let currentFood = null;
        let currentStep = 0;
        let collectedIngredients = new Set();

        // 选择美食
        function selectFood(foodId) {
            currentFood = foodData[foodId];
            currentStep = 0;
            collectedIngredients.clear();
            
            // 更新UI
            document.querySelectorAll('.food-select-card').forEach(card => {
                card.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
            
            // 显示制作区域
            document.getElementById('foodSelect').classList.add('hidden');
            document.getElementById('cookingArea').classList.remove('hidden');
            document.getElementById('completeArea').classList.add('hidden');
            
            // 设置标题
            document.getElementById('cookingTitle').textContent = `制作${currentFood.name}`;
            
            // 渲染食材
            renderIngredients();
            
            // 重置进度
            updateProgress();
        }

        // 渲染食材列表
        function renderIngredients() {
            const list = document.getElementById('ingredientList');
            list.innerHTML = currentFood.ingredients.map((ing, index) => `
                <div class="ingredient-item bg-gray-50 rounded-xl p-3 md:p-4 text-center cursor-pointer hover:bg-green-50 transition-all border-2 border-transparent" 
                     id="ing-${index}" onclick="collectIngredient(${index})">
                    <span class="text-2xl md:text-3xl block mb-2">${ing.emoji}</span>
                    <span class="text-sm md:text-base font-medium text-gray-700">${ing.name}</span>
                    <i class="fa fa-check text-green-500 ml-1 hidden"></i>
                </div>
            `).join('');
            
            document.getElementById('collectAllBtn').classList.add('hidden');
            document.getElementById('stepsArea').classList.add('hidden');
        }

        // 收集单个食材
        function collectIngredient(index) {
            const item = document.getElementById(`ing-${index}`);
            if (!item.classList.contains('collected')) {
                item.classList.add('collected');
                item.querySelector('.fa-check').classList.remove('hidden');
                collectedIngredients.add(index);
                
                if (collectedIngredients.size === currentFood.ingredients.length) {
                    document.getElementById('collectAllBtn').classList.remove('hidden');
                }
            }
        }

        // 收集所有食材
        function collectAllIngredients() {
            currentFood.ingredients.forEach((_, index) => {
                collectedIngredients.add(index);
            });
            
            document.getElementById('ingredientArea').classList.add('hidden');
            document.getElementById('stepsArea').classList.remove('hidden');
            
            renderSteps();
            updateProgress();
        }

        // 渲染步骤
        function renderSteps() {
            const list = document.getElementById('stepsList');
            list.innerHTML = currentFood.steps.map((step, index) => `
                <div class="step-card border-2 border-gray-200 rounded-xl p-4 md:p-6" id="step-${index}">
                    <div class="flex items-start gap-4">
                        <div class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center font-bold text-gray-600 flex-shrink-0">
                            ${index + 1}
                        </div>
                        <div class="flex-1">
                            <h3 class="text-lg font-bold text-gray-800 mb-2">${step.title}</h3>
                            <p class="text-gray-600 mb-3">${step.description}</p>
                            <div class="bg-yellow-50 rounded-lg p-3 text-sm text-yellow-800">
                                <i class="fa fa-lightbulb mr-1"></i>${step.tip}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            // 高亮第一步
            highlightStep(0);
        }

        // 高亮当前步骤
        function highlightStep(stepIndex) {
            document.querySelectorAll('.step-card').forEach((card, index) => {
                card.classList.remove('active', 'completed');
                if (index < stepIndex) {
                    card.classList.add('completed');
                } else if (index === stepIndex) {
                    card.classList.add('active');
                }
            });
            
            // 滚动到当前步骤
            const activeCard = document.getElementById(`step-${stepIndex}`);
            if (activeCard) {
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // 更新进度
        function updateProgress() {
            const total = currentFood.steps.length;
            const progress = Math.round((currentStep / total) * 100);
            document.getElementById('progressBar').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `${progress}%`;
            
            // 更新按钮状态
            document.getElementById('prevBtn').disabled = currentStep === 0;
            
            if (currentStep >= total) {
                showComplete();
            } else {
                const nextBtn = document.getElementById('nextBtn');
                if (currentStep === total - 1) {
                    nextBtn.innerHTML = '完成制作<i class="fa fa-check ml-2"></i>';
                } else {
                    nextBtn.innerHTML = '下一步<i class="fa fa-arrow-right ml-2"></i>';
                }
            }
        }

        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                highlightStep(currentStep);
                updateProgress();
            }
        }

        // 下一步
        function nextStep() {
            if (currentStep < currentFood.steps.length) {
                currentStep++;
                if (currentStep < currentFood.steps.length) {
                    highlightStep(currentStep);
                }
                updateProgress();
            }
        }

        // 显示完成
        function showComplete() {
            document.getElementById('stepsArea').classList.add('hidden');
            document.getElementById('completeArea').classList.remove('hidden');
            document.getElementById('progressText').textContent = '100%';
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('completeMessage').textContent = `您已成功学会了${currentFood.name}的制作方法！`;
        }

        // 重置制作
        function resetCooking() {
            currentStep = 0;
            collectedIngredients.clear();
            
            document.getElementById('completeArea').classList.add('hidden');
            document.getElementById('ingredientArea').classList.remove('hidden');
            document.getElementById('stepsArea').classList.add('hidden');
            
            renderIngredients();
            updateProgress();
        }

        // 返回选择
        function backToSelect() {
            document.getElementById('cookingArea').classList.add('hidden');
            document.getElementById('foodSelect').classList.remove('hidden');
            
            document.querySelectorAll('.food-select-card').forEach(card => {
                card.classList.remove('selected');
            });
        }
    </script>
</body>
</html>
